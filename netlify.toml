# Publication : le fichier appAAAAMMJJHHMM.html le plus recent est publie.
# Exemple : app202608311222.html
# Que des chiffres, aucun tiret ni espace : le nom survit au telechargement,
# et il change a chaque livraison donc le navigateur n ajoute jamais de (1).
# Repli : si aucun app*.html, on reprend l ancien index-AAAA-MM-JJ-HFhMM.html.
[build]
  publish = "."
  functions = "netlify/functions"
  command = 'latest=$(ls -1 app*.html 2>/dev/null | LC_ALL=C sort | tail -n 1); if [ -z "$latest" ]; then latest=$(ls -1 index-*.html 2>/dev/null | LC_ALL=C sort | tail -n 1); fi; if [ -n "$latest" ]; then echo "Version publiee : $latest"; cp "$latest" index.html; else echo "Aucune source, index.html conserve"; fi'

[[redirects]]
from = "/api/proxy"
to = "/.netlify/functions/proxy"
status = 200

[[redirects]]
from = "/api/sheet"
to = "/.netlify/functions/sheet"
status = 200

[[redirects]]
from = "/api/cache"
to = "/.netlify/functions/cache"
status = 200

[[redirects]]
from = "/api/notify-seuil"
to = "/.netlify/functions/notify-seuil"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
