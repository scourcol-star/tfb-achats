<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFB — Inventaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#f7f5f0;--sur:#fff;--sur2:#f2f0eb;--bor:#e4e0d8;--bor2:#d4cfc5;--tx:#1a1a18;--tx2:#6b6860;--tx3:#9b9890;--gold:#c8a96e;--gdark:#a8893e;--gbg:#faf6ee;--green:#16a34a;--red:#dc2626;--amber:#d97706;--blue:#2563eb;--r:10px;--rs:6px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh;}
.topbar{background:var(--sur);border-bottom:1px solid var(--bor);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-l{display:flex;align-items:center;gap:18px;}
.logo{font-size:15px;font-weight:600;letter-spacing:-.3px;}
.logo span{color:var(--gold);}.logo-link{display:inline-flex;align-items:center;text-decoration:none}.logo-img{height:30px;width:auto;display:block}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--gbg);color:var(--gdark);border:1px solid #e8d9b8;}
.pagenav{display:flex;gap:2px;background:var(--sur2);border-radius:var(--rs);padding:3px;}
.pagenav a{font-size:12px;font-weight:500;padding:5px 12px;border-radius:4px;color:var(--tx2);text-decoration:none;}
.pagenav a.active{background:var(--tx);color:#fff;}
.pagenav a:hover:not(.active){background:#e9e6df;color:var(--tx);}
.topbar-r{display:flex;align-items:center;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);border:1px solid var(--bor2);background:var(--sur);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap;font-family:inherit;}
.btn:hover{background:var(--sur2);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn-gold:hover{background:var(--gdark);}
.btn-sm{padding:5px 10px;font-size:12px;}
.main{max-width:1400px;margin:0 auto;padding:24px;}
.conn{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);margin-bottom:20px;}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;flex-shrink:0;}
.dot.ok{background:var(--green);}
.dot.err{background:var(--red);}
.dot.spin{background:var(--amber);animation:pulse 1s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.conn-t{font-size:13px;color:var(--tx2);}
.conn-t strong{color:var(--tx);font-weight:600;}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.fg{display:flex;gap:2px;background:var(--sur2);border-radius:var(--rs);padding:3px;}
.fgb{font-size:12px;font-weight:500;padding:4px 10px;border-radius:4px;border:none;background:transparent;color:var(--tx2);cursor:pointer;font-family:inherit;}
.fgb.active{background:var(--tx);color:#fff;}
.fgb:hover:not(.active){background:var(--sur2);color:var(--tx);}
select,.si{height:34px;padding:0 10px;border-radius:var(--rs);border:1px solid var(--bor);background:var(--sur);color:var(--tx);font-size:13px;font-family:inherit;}
select:focus,.si:focus{outline:none;border-color:var(--gold);}
.sw{position:relative;}
.sw .si{padding-left:30px;min-width:200px;}
.sw i{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:15px;pointer-events:none;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.metric{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:16px;}
.ml{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:8px;}
.mv{font-size:22px;font-weight:600;color:var(--tx);letter-spacing:-.5px;}
.ms{font-size:12px;color:var(--tx3);margin-top:3px;}
.metric.accent{border-color:#e8d9b8;background:var(--gbg);}
.metric.accent .mv{color:var(--gdark);}
.section{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden;margin-bottom:16px;}
.tabs{display:flex;border-bottom:1px solid var(--bor);overflow-x:auto;}
.tab{font-size:13px;font-weight:500;padding:12px 16px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab.active{color:var(--tx);border-bottom-color:var(--gold);}
.tab:hover:not(.active){color:var(--tx);}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bor);gap:12px;flex-wrap:wrap;}
.st{font-size:13px;font-weight:600;}
.sm{font-size:12px;color:var(--tx3);}
.tw{overflow-x:auto;max-height:560px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{position:sticky;top:0;background:var(--sur);z-index:1;}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);border-bottom:1px solid var(--bor);white-space:nowrap;cursor:pointer;user-select:none;}
th .car{opacity:.4;font-size:12px;}
th.s .car{opacity:1;color:var(--gold);}
td{padding:9px 12px;border-bottom:1px solid var(--bor);color:var(--tx);vertical-align:middle;white-space:nowrap;}
tbody tr:hover{background:var(--sur2);}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;}
.pill-paris{background:#eef2ff;color:#3730a3;}
.pill-bordeaux{background:#fdf2f8;color:#9d174d;}
.pill-lille{background:#e9faf0;color:#166534;}
.pill-cc{background:var(--gbg);color:var(--gdark);}
.ok-y{color:var(--green);font-weight:600;}
.ok-n{color:var(--amber);font-weight:600;}
.chartwrap{padding:16px;}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.chartgrid .full{grid-column:1/-1;}
.cbox{background:var(--sur2);border-radius:var(--r);padding:16px;}
.ctitle{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em;}
.cinner{position:relative;height:280px;}
.cinner.tall{height:240px;}
.empty{padding:48px;text-align:center;color:var(--tx3);}
@media(max-width:760px){.chartgrid{grid-template-columns:1fr;}}
.ref-cell{color:var(--tx3);cursor:pointer;user-select:none;white-space:nowrap;}
.ref-cell:hover{color:var(--gdark);}
.ref-cell .rc-car{display:inline-block;font-size:10px;margin-right:5px;color:var(--tx3);transition:transform .15s;}
.ref-cell.open{color:var(--tx);font-weight:600;}
.ref-cell.open .rc-car{transform:rotate(90deg);color:var(--gdark);}
.det-row>td{background:var(--gbg);padding:2px 12px 12px 34px;}
.det-inner{padding:6px 0;color:var(--tx2);font-size:12px;}
.det-tbl{width:auto;min-width:320px;border-collapse:collapse;}
.det-tbl th{text-align:left;padding:6px 18px 6px 0;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);border-bottom:1px solid var(--bor);}
.det-tbl td{padding:5px 18px 5px 0;border-bottom:1px solid var(--bor);color:var(--tx);}
.det-tbl .det-tot td{font-weight:700;border-bottom:none;}
.det-tbl .num{text-align:right;font-variant-numeric:tabular-nums;}
</style>
</head>

<script>
// ===== Config =====
const PROXY = "/api/proxy";
const PAGE = 200; // pagination Inpulse
const LIST_EP = "/v1/stocks/inventories"; // POST {storeIds:[]} -> {inventories, totalCount}
const STORE_IDS = ["41712550-9528-11f0-99ae-49d8e489343b","be446340-8fb9-11f0-a12b-690e93f68ae2","be012c50-2862-11f1-bd5f-f7b0a703feb4","e6f59020-8fb9-11f0-975b-2726f4fe3aed","d32ed970-8fb9-11f0-975b-2726f4fe3aed","94a553f0-8fb9-11f0-a5ad-37d09fba6a0b","a5ddbea0-8fb9-11f0-975b-2726f4fe3aed","b353a310-8fb9-11f0-a12b-690e93f68ae2","61f9fbe0-8fb9-11f0-9586-c9a0d6a19dc3","753b2ee0-8fb9-11f0-83bf-f96a1806d919","f79b9b50-8fb8-11f0-8d72-8158dd11ce20","2933d5b0-8fb9-11f0-975b-2726f4fe3aed","28acb6b0-d128-11f0-868f-59be9a201bad","84b8a320-8fb9-11f0-a12b-690e93f68ae2","064bd480-8fb9-11f0-83bf-f96a1806d919","19d16380-8fb9-11f0-9f81-21aea717c1be","3a756820-8fb9-11f0-83bf-f96a1806d919","52050db0-8fb9-11f0-83bf-f96a1806d919","756a96c0-d69b-11f0-99e1-bd8049e1162b"]; // 18 boutiques + labos (comme app Inpulse)

const S = { all:[], filtered:[], group:"ALL", site:"", period:"all", q:"",
            tab:"liste", sort:{liste:{k:"date",d:-1}, sites:{k:"value",d:-1}} };
let charts = {};

const fmtEur = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const fmtEur2 = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const fmtDate = s => { try{ return new Date(s).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"}); }catch{ return s||"—"; } };
const monthKey = s => { const d=new Date(s); return isNaN(d)?"?":(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); };
const groupClass = g => (g && g.indexOf("LAB ")===0 ? "pill-cc" : ({Paris:"pill-paris",Bordeaux:"pill-bordeaux",Lille:"pill-lille"}[g]||"pill-paris"));

// ===== Proxy =====
async function callProxy(endpoint, body, method){
  const r = await fetch(PROXY, { method:"POST", headers:{"Content-Type":"application/json"},
                                 body: JSON.stringify({ endpoint, body, method }) });
  if(!r.ok){
    let msg = "HTTP "+r.status;
    if(r.status===403) msg = "Endpoint non autorisé par le proxy — ajoute \""+LIST_EP+"\" à la liste ALLOWED de api/proxy.js";
    throw new Error(msg);
  }
  return r.json();
}

// ===== Parse =====
function parseInv(o){
  const store = o.lnkStoreInventorylistrel || {};
  const name = store.name || o.storeName || o.storeId || "—";
  let group, site;
  if(/^TFB\s+LAB/i.test(name)){ let raw = name.replace(/^TFB\s+LAB\s*/i,"").trim(); site = raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase(); group = /chalifert/i.test(name) ? "LAB Chalifert" : (/lognes/i.test(name) ? "LAB Lognes" : "LAB "+site); }
  else {
    site = name.replace(/^TFB\s+RESEAU\s*/i,"").trim();
    if(/bordeaux/i.test(name)) group="Bordeaux";
    else if(/lille/i.test(name)) group="Lille";
    else group="Paris";
  }
  return { id:o.id, name, site, group,
           ref:o.reference||"—",
           total:+(o.total)||0,
           date:o.inventoryDate||o.timestamp||o.createdAt,
           validated:!!o.isValidated };
}

// ===== Load =====
async function loadAll(){
  setDot("spin","Chargement des inventaires…");
  try{
    let skip=0, total=Infinity, rows=[];
    while(skip < total){
      const ep = LIST_EP+`?skip=${skip}&limit=${PAGE}&orderBy=template&orderType=desc&type=${encodeURIComponent('{"inq":["stock"]}')}`;
      const d = await callProxy(ep, { storeIds: STORE_IDS });
      const inv = (d && (d.inventories || d.data || (Array.isArray(d)?d:[]))) || [];
      total = (d && typeof d.totalCount==="number") ? d.totalCount : (skip+inv.length);
      rows = rows.concat(inv);
      if(inv.length < PAGE) break;
      skip += PAGE;
      if(skip > 20000) break;
    }
    S.all = rows.map(parseInv).filter(r=>r.date);
    populateSites();
    setDot("ok", `<strong>${S.all.length}</strong> inventaires chargés · ${new Set(S.all.map(r=>r.site)).size} sites`);
    applyFilters();
  }catch(e){
    setDot("err", "Erreur de chargement — "+e.message);
    document.getElementById("metrics").innerHTML="";
    document.getElementById("panel").innerHTML=`<div class="empty">${e.message}</div>`;
  }
}

function setDot(cls, html){
  document.getElementById("dot").className = "dot "+cls;
  document.getElementById("conn-t").innerHTML = html;
}

function populateSites(){
  const sel = document.getElementById("site");
  const cur = sel.value;
  const sites = [...new Set(S.all.map(r=>r.site))].sort((a,b)=>a.localeCompare(b,"fr"));
  sel.innerHTML = '<option value="">Tous les sites</option>' + sites.map(s=>`<option>${s}</option>`).join("");
  if(sites.includes(cur)) sel.value = cur;
}

// ===== Filters =====
function periodMatch(dateStr){
  if(S.period==="all") return true;
  const d=new Date(dateStr); if(isNaN(d)) return false;
  const now=new Date();
  if(S.period==="y") return d.getFullYear()===2026;
  if(S.period==="m0") return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  if(S.period==="m1"){ const m=new Date(now.getFullYear(),now.getMonth()-1,1);
    return d.getFullYear()===m.getFullYear() && d.getMonth()===m.getMonth(); }
  return true;
}
function applyFilters(){
  const q=S.q.toLowerCase();
  S.filtered = S.all.filter(r=>
    (S.group==="ALL" || r.group===S.group) &&
    (!S.site || r.site===S.site) &&
    periodMatch(r.date) &&
    (!q || r.site.toLowerCase().includes(q) || r.ref.toLowerCase().includes(q))
  );
  renderMetrics();
  renderPanel();
}

// Latest inventory per site within the filtered set
function latestPerSite(rows){
  const m={};
  rows.forEach(r=>{ const k=r.site; if(!m[k] || new Date(r.date)>new Date(m[k].date)) m[k]=r; });
  return Object.values(m);
}

// ===== Metrics =====
function renderMetrics(){
  const latest = latestPerSite(S.filtered);
  const totalVal = latest.reduce((s,r)=>s+r.total,0);
  const boutiques = latest.filter(r=>r.group.indexOf("LAB ")!==0);
  const cc = latest.filter(r=>r.group==="LAB Chalifert");
  const valB = boutiques.reduce((s,r)=>s+r.total,0);
  const valC = cc.reduce((s,r)=>s+r.total,0);
  const cards=[
    {l:"Valeur stock (dern. inv.)", v:fmtEur(totalVal), s:`${latest.length} site${latest.length>1?"s":""}`, a:true},
    {l:"Inventaires", v:S.filtered.length, s:"sur la période"},
    {l:"Stock boutiques", v:fmtEur(valB), s:`${boutiques.length} boutique${boutiques.length>1?"s":""}`},
    {l:"Stock cuisine centrale", v:fmtEur(valC), s:`Chalifert`},
    {l:"À valider", v:S.filtered.filter(r=>!r.validated).length, s:"inventaires non validés"},
  ];
  document.getElementById("metrics").innerHTML = cards.map(c=>
    `<div class="metric${c.a?" accent":""}"><div class="ml">${c.l}</div><div class="mv">${c.v}</div><div class="ms">${c.s}</div></div>`
  ).join("");
}

// ===== Panel render =====
function renderPanel(){
  if(S.tab==="liste") renderListe();
  else if(S.tab==="sites") renderSites();
  else renderEvo();
}

function carat(state,k){ return `<span class="car">${state.k===k?(state.d>0?"▲":"▼"):"↕"}</span>`; }
function sortRows(rows, state, getters){
  const g=getters[state.k]; if(!g) return rows;
  return [...rows].sort((a,b)=>{ const x=g(a),y=g(b);
    if(typeof x==="number") return (x-y)*state.d;
    return String(x).localeCompare(String(y),"fr")*state.d; });
}

function renderListe(){
  document.getElementById("sh-title").textContent="Inventaires";
  document.getElementById("sh-sub").textContent=`${S.filtered.length} ligne${S.filtered.length>1?"s":""}`;
  const st=S.sort.liste;
  const get={site:r=>r.site, group:r=>r.group, date:r=>new Date(r.date).getTime(), ref:r=>r.ref, value:r=>r.total, val:r=>r.validated?1:0};
  const rows=sortRows(S.filtered, st, get);
  if(!rows.length){ document.getElementById("panel").innerHTML=`<div class="empty">Aucun inventaire pour ce filtre.</div>`; return; }
  const cols=[["site","Site"],["group","Groupe"],["date","Date"],["ref","Référence"],["value","Total HT"],["val","Statut"]];
  const th=cols.map(([k,l])=>`<th class="${st.k===k?"s":""}${k==="value"?" num":""}" data-k="${k}">${l} ${carat(st,k)}</th>`).join("");
  const body=rows.map(r=>`<tr>
    <td>${r.site}</td>
    <td><span class="pill ${groupClass(r.group)}">${r.group}</span></td>
    <td>${fmtDate(r.date)}</td>
    <td class="ref-cell" data-id="${r.id}"><span class="rc-car">▸</span>${r.ref}</td>
    <td class="num">${fmtEur2(r.total)}</td>
    <td>${r.validated?'<span class="ok-y">Validé</span>':'<span class="ok-n">En cours</span>'}</td>
  </tr>`).join("");
  document.getElementById("panel").innerHTML=`<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
  document.querySelectorAll("#panel th").forEach(t=>t.onclick=()=>{ const k=t.dataset.k;
    if(st.k===k) st.d*=-1; else { st.k=k; st.d=(k==="site"||k==="group"||k==="ref")?1:-1; } renderListe(); });
}

function renderSites(){
  document.getElementById("sh-title").textContent="État par site";
  const latest=latestPerSite(S.filtered);
  document.getElementById("sh-sub").textContent=`${latest.length} site${latest.length>1?"s":""} · dernier inventaire`;
  const counts={}; S.filtered.forEach(r=>counts[r.site]=(counts[r.site]||0)+1);
  const st=S.sort.sites;
  const get={site:r=>r.site, group:r=>r.group, date:r=>new Date(r.date).getTime(), value:r=>r.total, n:r=>counts[r.site]||0, val:r=>r.validated?1:0};
  const rows=sortRows(latest, st, get);
  if(!rows.length){ document.getElementById("panel").innerHTML=`<div class="empty">Aucun inventaire pour ce filtre.</div>`; return; }
  const cols=[["site","Site"],["group","Groupe"],["date","Dernier inv."],["value","Valeur stock"],["n","Nb inv."],["val","Statut"]];
  const th=cols.map(([k,l])=>`<th class="${st.k===k?"s":""}${(k==="value"||k==="n")?" num":""}" data-k="${k}">${l} ${carat(st,k)}</th>`).join("");
  const body=rows.map(r=>`<tr>
    <td><strong>${r.site}</strong></td>
    <td><span class="pill ${groupClass(r.group)}">${r.group}</span></td>
    <td>${fmtDate(r.date)}</td>
    <td class="num">${fmtEur2(r.total)}</td>
    <td class="num">${counts[r.site]||0}</td>
    <td>${r.validated?'<span class="ok-y">Validé</span>':'<span class="ok-n">En cours</span>'}</td>
  </tr>`).join("");
  document.getElementById("panel").innerHTML=`<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
  document.querySelectorAll("#panel th").forEach(t=>t.onclick=()=>{ const k=t.dataset.k;
    if(st.k===k) st.d*=-1; else { st.k=k; st.d=(k==="site"||k==="group")?1:-1; } renderSites(); });
}

function renderEvo(){
  document.getElementById("sh-title").textContent="Évolution & répartition";
  document.getElementById("sh-sub").textContent="";
  document.getElementById("panel").innerHTML=`
    <div class="chartwrap"><div class="chartgrid">
      <div class="cbox full"><div class="ctitle">Valeur de stock par site (dernier inventaire)</div><div class="cinner"><canvas id="c-site"></canvas></div></div>
      <div class="cbox"><div class="ctitle">Valeur de stock par mois</div><div class="cinner tall"><canvas id="c-month"></canvas></div></div>
      <div class="cbox"><div class="ctitle">Boutiques vs cuisine centrale</div><div class="cinner tall"><canvas id="c-split"></canvas></div></div>
    </div></div>`;
  Object.values(charts).forEach(c=>{try{c.destroy();}catch{}}); charts={};
  const GOLD="#c8a96e", INK="#1a1a18", grid="#e4e0d8";
  const latest=latestPerSite(S.filtered).sort((a,b)=>b.total-a.total);

  charts.site = new Chart(document.getElementById("c-site"),{ type:"bar",
    data:{ labels:latest.map(r=>r.site),
           datasets:[{ data:latest.map(r=>r.total), backgroundColor:latest.map(r=>r.group.indexOf("LAB ")===0?GOLD:INK), borderRadius:4 }] },
    options:{ responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>fmtEur2(c.parsed.y)}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:grid},ticks:{callback:v=>fmtEur(v),font:{size:11}}}} } });

  // par mois (somme des inventaires du mois)
  const months={}; S.filtered.forEach(r=>{ const k=monthKey(r.date); months[k]=(months[k]||0)+r.total; });
  const mk=Object.keys(months).filter(k=>k!=="?").sort();
  charts.month = new Chart(document.getElementById("c-month"),{ type:"line",
    data:{ labels:mk.map(k=>{const[y,m]=k.split("-");return new Date(y,m-1).toLocaleDateString("fr-FR",{month:"short",year:"2-digit"});}),
           datasets:[{ data:mk.map(k=>months[k]), borderColor:GOLD, backgroundColor:"rgba(200,169,110,.12)", fill:true, tension:.3, pointRadius:3 }] },
    options:{ responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>fmtEur2(c.parsed.y)}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{grid:{color:grid},ticks:{callback:v=>fmtEur(v),font:{size:11}}}} } });

  const valB=latest.filter(r=>r.group.indexOf("LAB ")!==0).reduce((s,r)=>s+r.total,0);
  const valC=latest.filter(r=>r.group.indexOf("LAB ")===0).reduce((s,r)=>s+r.total,0);
  charts.split = new Chart(document.getElementById("c-split"),{ type:"doughnut",
    data:{ labels:["Boutiques","Labos"], datasets:[{ data:[valB,valC], backgroundColor:[INK,GOLD], borderWidth:0 }] },
    options:{ responsive:true,maintainAspectRatio:false,cutout:"62%",
      plugins:{legend:{position:"bottom",labels:{font:{size:12},padding:14}},
      tooltip:{callbacks:{label:c=>c.label+": "+fmtEur2(c.parsed)}}} } });
}

// ===== CSV =====
function doExport(){
  const rows=S.filtered;
  const head=["Site","Groupe","Date","Reference","Total HT","Statut"];
  const lines=[head.join(";")].concat(rows.map(r=>[
    r.site, r.group, fmtDate(r.date), r.ref, String(r.total).replace(".",","),
    r.validated?"Valide":"En cours"
  ].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")));
  const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="inventaires_tfb_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
}

// ===== Events =====
document.getElementById("grp").addEventListener("click",e=>{ const b=e.target.closest(".fgb"); if(!b)return;
  document.querySelectorAll("#grp .fgb").forEach(x=>x.classList.remove("active")); b.classList.add("active");
  S.group=b.dataset.g; applyFilters(); });
document.getElementById("site").addEventListener("change",e=>{ S.site=e.target.value; applyFilters(); });
document.getElementById("period").addEventListener("change",e=>{ S.period=e.target.value; applyFilters(); });
document.getElementById("search").addEventListener("input",e=>{ S.q=e.target.value; applyFilters(); });
document.getElementById("tabs").addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active");
  S.tab=t.dataset.t; renderPanel(); });
// ===== Detail par categorie (clic sur reference) =====
const detCache = {};
function catBreakdown(inv){
  var m = {};
  ((inv && inv.inventories) || []).forEach(function(li){
    var rel = li.lnkSupplierproductInventoryrel || {};
    var cat = rel.category || "Autres";
    m[cat] = (m[cat]||0) + (li.tot||0)*(li.price||0);
  });
  return Object.entries(m).sort(function(a,b){ return b[1]-a[1]; });
}
async function toggleDetail(id, cell){
  var tr = cell.closest("tr");
  var det = tr.nextElementSibling;
  if(det && det.classList.contains("det-row")){
    var show = det.style.display==="none";
    det.style.display = show ? "" : "none"; cell.classList.toggle("open", show); return;
  }
  det = document.createElement("tr"); det.className = "det-row";
  det.innerHTML = '<td colspan="6"><div class="det-inner">Chargement des cat\u00e9gories\u2026</div></td>';
  tr.after(det); cell.classList.add("open");
  var inner = det.querySelector(".det-inner");
  try{
    var inv = detCache[id];
    if(!inv){ inv = await callProxy("/v1/stocks/inventories/"+id, null, "GET"); detCache[id] = inv; }
    var cats = catBreakdown(inv);
    var tot = cats.reduce(function(s,c){ return s+c[1]; },0);
    var rowsH = cats.map(function(c){ return "<tr><td>"+c[0]+'</td><td class="num">'+fmtEur2(c[1])+'</td><td class="num">'+(tot?Math.round(c[1]/tot*100):0)+"%</td></tr>"; }).join("");
    inner.innerHTML = '<table class="det-tbl"><thead><tr><th>Cat\u00e9gorie</th><th class="num">Total HT</th><th class="num">Part</th></tr></thead><tbody>'
      + rowsH
      + '<tr class="det-tot"><td>Total</td><td class="num">'+fmtEur2(tot)+'</td><td class="num">100%</td></tr></tbody></table>';
  }catch(e){ inner.innerHTML = '<div class="det-inner">Erreur : '+e.message+'</div>'; }
}
document.getElementById("panel").addEventListener("click", function(e){ var c = e.target.closest(".ref-cell"); if(c) toggleDetail(c.dataset.id, c); });
document.getElementById("btn-reload").addEventListener("click",loadAll);
document.getElementById("btn-csv").addEventListener("click",doExport);

loadAll();
</script>
