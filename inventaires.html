<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFB — Inventaires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f7f5f0;--sur:#fff;--sur2:#f2f0eb;--bor:#e4e0d8;--bor2:#d4cfc5;--tx:#1a1a18;--tx2:#6b6860;--tx3:#9b9890;--gold:#c8a96e;--gdark:#a8893e;--gbg:#faf6ee;--green:#16a34a;--red:#dc2626;--amber:#d97706;--blue:#2563eb;--r:10px;--rs:6px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;min-height:100vh;}
.topbar{background:var(--sur);border-bottom:1px solid var(--bor);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-l{display:flex;align-items:center;gap:18px;}
.logo{font-size:15px;font-weight:600;letter-spacing:-.3px;}
.logo span{color:var(--gold);}.logo-link{display:inline-flex;align-items:center;text-decoration:none}.logo-img{height:30px;width:auto;display:block}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--gbg);color:var(--gdark);border:1px solid #e8d9b8;}
.pagenav{display:flex;gap:2px;background:var(--sur2);border-radius:var(--rs);padding:3px;}
.pagenav a{font-size:12px;font-weight:500;padding:5px 12px;border-radius:4px;color:var(--tx2);text-decoration:none;}
.pagenav a.active{background:var(--amber);color:#fff;}
.pagenav a:hover:not(.active){background:#e9e6df;color:var(--tx);}
.topbar-r{display:flex;align-items:center;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);border:1px solid var(--bor2);background:var(--sur);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap;font-family:inherit;}
.btn:hover{background:var(--sur2);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-gold{background:var(--amber);color:#fff;border-color:var(--amber);}
  .btn-gold:hover{background:#b45f04;border-color:#b45f04;}
.btn-sm{padding:5px 10px;font-size:12px;}
.main{max-width:1400px;margin:0 auto;padding:24px;}
.conn{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);margin-bottom:20px;}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;flex-shrink:0;}
.dot.ok{background:var(--green);}
.dot.err{background:var(--red);}
.dot.spin{background:var(--amber);animation:pulse 1s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.conn-t{font-size:13px;color:var(--tx2);}
.conn-t strong{color:var(--tx);font-weight:600;}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.fg{display:flex;gap:6px;flex-wrap:wrap;background:transparent;border:none;padding:0}
.fgb,.fgb2{font-size:12.5px;font-weight:500;padding:6px 14px;border-radius:999px;border:1px solid var(--bor);background:var(--sur);color:var(--tx2);cursor:pointer;font-family:inherit;transition:.12s}
.fgb.active,.fgb2.active{background:var(--amber);color:#fff;border-color:var(--amber);font-weight:700}
.fgb:hover:not(.active),.fgb2:hover:not(.active){border-color:var(--amber);color:var(--tx);background:var(--sur)}
select,.si{height:34px;padding:0 10px;border-radius:var(--rs);border:1px solid var(--bor);background:var(--sur);color:var(--tx);font-size:13px;font-family:inherit;}
select:focus,.si:focus{outline:none;border-color:var(--gold);}
.sw{position:relative;}
.sw .si{padding-left:30px;min-width:200px;}
.sw i{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:15px;pointer-events:none;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.metric{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);padding:16px;}
.ml{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin-bottom:8px;}
.mv{font-size:22px;font-weight:600;color:var(--tx);letter-spacing:-.5px;}
.ms{font-size:12px;color:var(--tx3);margin-top:3px;}
.metric.accent{border-color:#e8d9b8;background:var(--gbg);}
.metric.accent .mv{color:var(--gdark);}
.section{background:var(--sur);border:1px solid var(--bor);border-radius:var(--r);overflow:hidden;margin-bottom:16px;}
.tabs{display:flex;border-bottom:1px solid var(--bor);overflow-x:auto;overflow-y:hidden;}
.tab{font-size:13px;font-weight:500;padding:12px 16px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab.active{color:var(--amber);font-weight:700;border-bottom-color:var(--amber);}
.tab:hover:not(.active){color:var(--tx);}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bor);gap:12px;flex-wrap:wrap;}
.st{font-size:13px;font-weight:600;}
.sm{font-size:12px;color:var(--tx3);}
.tw{overflow-x:auto;max-height:560px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{position:sticky;top:0;background:var(--sur);z-index:1;}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);border-bottom:1px solid var(--bor);white-space:nowrap;cursor:pointer;user-select:none;}
th .car{opacity:.4;font-size:12px;}
th.s .car{opacity:1;color:var(--gold);}
td{padding:9px 12px;border-bottom:1px solid var(--bor);color:var(--tx);vertical-align:middle;white-space:nowrap;}
tbody tr:hover{background:var(--sur2);}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;}
.pill-paris{background:#eef2ff;color:#3730a3;}
.pill-bordeaux{background:#fdf2f8;color:#9d174d;}
.pill-lille{background:#e9faf0;color:#166534;}
.pill-cc{background:var(--gbg);color:var(--gdark);}
.ok-y{color:var(--green);font-weight:600;}
.ok-n{color:var(--amber);font-weight:600;}
.chartwrap{padding:16px;}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.chartgrid .full{grid-column:1/-1;}
.cbox{background:var(--sur2);border-radius:var(--r);padding:16px;}
.ctitle{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em;}
.cinner{position:relative;height:280px;}
.cinner.tall{height:240px;}
.empty{padding:48px;text-align:center;color:var(--tx3);}
@media(max-width:760px){.chartgrid{grid-template-columns:1fr;}}
.ref-cell{color:var(--tx3);cursor:pointer;user-select:none;white-space:nowrap;}
.ref-cell:hover{color:var(--gdark);}
.ref-cell .rc-car{display:inline-block;font-size:10px;margin-right:5px;color:var(--tx3);transition:transform .15s;}
.ref-cell.open{color:var(--tx);font-weight:600;}
.ref-cell.open .rc-car{transform:rotate(90deg);color:var(--gdark);}
.det-row>td{background:var(--gbg);padding:2px 12px 12px 34px;}
.det-inner{padding:6px 0;color:var(--tx2);font-size:12px;}
.det-tbl{width:auto;min-width:320px;border-collapse:collapse;}
.det-tbl th{text-align:left;padding:6px 18px 6px 0;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);border-bottom:1px solid var(--bor);}
.det-tbl td{padding:5px 18px 5px 0;border-bottom:1px solid var(--bor);color:var(--tx);}
.det-tbl .det-tot td{font-weight:700;border-bottom:none;}
.det-tbl .num{text-align:right;font-variant-numeric:tabular-nums;}
.det-tbl td{vertical-align:middle;}
.det-tbl .det-cat{cursor:pointer;}
.det-tbl .det-cat>td{border-top:2px solid var(--bor2);padding-top:7px;padding-bottom:7px;}
.det-tbl .det-cat .c-cat{font-weight:700;color:var(--tx);}
.det-tbl .det-cat:hover>td{background:var(--sur2);}
.det-tbl .det-zone{cursor:pointer;}
.det-tbl .det-zone>td{background:var(--gbg);}
.det-tbl .det-zone .c-zone{padding-left:22px;font-weight:600;color:var(--gdark);}
.det-tbl .det-zone:hover>td{background:#f3ecdd;}
.det-tbl .det-prod>td{color:var(--tx2);}
.det-tbl .det-prod .c-prod{padding-left:46px;}
.det-tbl .det-prod .lbl{border-left:2px solid var(--bor);padding-left:8px;}
.det-tbl .arw{display:inline-block;width:14px;color:var(--tx3);font-size:10px;}
.det-tbl .det-cat .arw{color:var(--gdark);}
.det-tbl .det-tot>td{border-top:2px solid var(--bor2);}
@media(max-width:680px){.main{padding:12px !important}.topbar{flex-wrap:wrap;height:auto !important;min-height:52px;padding:8px 12px !important;row-gap:8px}.topbar>div{flex-wrap:wrap}.topbar-l,.topbar-r{flex-wrap:wrap;gap:8px}.logo-img{height:24px}.filters{gap:8px}.filters>select,.filters>input{flex:1 1 100%;width:100%;min-width:0}.fg{width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}.fgb,.fgb2{white-space:nowrap}#tabs,.tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}.tab{white-space:nowrap}.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}.tw table{min-width:600px}thead th{white-space:nowrap}.metrics{grid-template-columns:1fr 1fr !important}.charts-grid,.chartgrid{grid-template-columns:1fr !important}} thead th{cursor:pointer} thead th:hover{background:var(--sur2)} /*FIX-CHART-CUT*/.charts-grid>*,.chartgrid>*,.chart-box>*,.chart-box [style*="grid"]>*{min-width:0}canvas{max-width:100% !important}@media(max-width:680px){.chart-box [style*="grid-template-columns"]{grid-template-columns:1fr !important}}</style>
</head>

<script>
// ===== Config =====
const PROXY = "/api/proxy";
const CACHE = "/api/cache";
let LAST_SYNC = null;
function minusDays(iso, days){ try{ const d=new Date(iso); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10); }catch(e){ return "2024-01-01"; } }
const LS_TTL=30*60*1000;
window.__CACHE_FRESH_LOCAL__=false;
function __lsGet(key){ try{ const raw=localStorage.getItem("tfbc:"+key); if(!raw)return null; const o=JSON.parse(raw); if(!o||!o.d)return null; o.fresh=(Date.now()-(o.t||0))<LS_TTL; return o; }catch(e){ return null; } }
function __lsSet(key,b64){ try{ localStorage.setItem("tfbc:"+key, JSON.stringify({t:Date.now(),d:b64})); }catch(e){} }
function __decodeSnap(b64){ const b=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)); return JSON.parse(pako.ungzip(b,{to:"string"})); }
async function cacheGet(key){
  const ls=__lsGet(key);
  if(ls && ls.fresh){ try{ window.__CACHE_FRESH_LOCAL__=true; return __decodeSnap(ls.d); }catch(e){} }
  window.__CACHE_FRESH_LOCAL__=false;
  try{
    const r=await fetch(CACHE+"?key="+key,{cache:"no-store"});
    if(!r.ok){ try{ return ls?__decodeSnap(ls.d):null; }catch(e){ return null; } }
    const j=await r.json();
    if(!j||!j.dataB64){ try{ return ls?__decodeSnap(ls.d):null; }catch(e){ return null; } }
    __lsSet(key,j.dataB64);
    return __decodeSnap(j.dataB64);
  }catch(e){ console.warn("cacheGet",e); try{ return ls?__decodeSnap(ls.d):null; }catch(_){ return null; } }
}
async function cacheSet(key,obj){
  try{
    const gz=pako.gzip(JSON.stringify(obj)); let bin=""; const CH=0x8000;
    for(let i=0;i<gz.length;i+=CH){ bin+=String.fromCharCode.apply(null,gz.subarray(i,i+CH)); }
    const b64=btoa(bin);
    __lsSet(key,b64);
    const r=await fetch(CACHE+"?key="+key,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dataB64:b64})});
    return r.ok;
  }catch(e){ console.warn("cacheSet",e); return false; }
}
const PAGE = 100; // pagination Inpulse
const LIST_EP = "/public/v2/inventories"; // POST {storeIds:[]} -> {inventories, totalCount}
const STORE_IDS = ["41712550-9528-11f0-99ae-49d8e489343b","be446340-8fb9-11f0-a12b-690e93f68ae2","be012c50-2862-11f1-bd5f-f7b0a703feb4","e6f59020-8fb9-11f0-975b-2726f4fe3aed","d32ed970-8fb9-11f0-975b-2726f4fe3aed","94a553f0-8fb9-11f0-a5ad-37d09fba6a0b","a5ddbea0-8fb9-11f0-975b-2726f4fe3aed","b353a310-8fb9-11f0-a12b-690e93f68ae2","61f9fbe0-8fb9-11f0-9586-c9a0d6a19dc3","753b2ee0-8fb9-11f0-83bf-f96a1806d919","f79b9b50-8fb8-11f0-8d72-8158dd11ce20","2933d5b0-8fb9-11f0-975b-2726f4fe3aed","28acb6b0-d128-11f0-868f-59be9a201bad","84b8a320-8fb9-11f0-a12b-690e93f68ae2","064bd480-8fb9-11f0-83bf-f96a1806d919","19d16380-8fb9-11f0-9f81-21aea717c1be","3a756820-8fb9-11f0-83bf-f96a1806d919","52050db0-8fb9-11f0-83bf-f96a1806d919","756a96c0-d69b-11f0-99e1-bd8049e1162b"]; // 18 boutiques + labos (comme app Inpulse)

            tab:"liste", sort:{liste:{k:"date",d:-1}, sites:{k:"value",d:-1}} };

const fmtEur = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const fmtEur2 = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0); const fmtQ = n => new Intl.NumberFormat("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:2}).format(n||0);
function __sh(id){ return document.getElementById(id) || {}; }
const fmtDate = s => { try{ return new Date(s).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"}); }catch{ return s||"—"; } };

const groupClass = g => (g && g.indexOf("LAB ")===0 ? "pill-cc" : ({Paris:"pill-paris",Bordeaux:"pill-bordeaux",Lille:"pill-lille"}[g]||"pill-paris"));

// ===== Proxy =====
async function callProxy(endpoint, body, method){
  const r = await fetch(PROXY, { method:"POST", headers:{"Content-Type":"application/json"},
                                 body: JSON.stringify({ endpoint, body, method }) });
  if(!r.ok){
    let msg = "HTTP "+r.status;
    if(r.status===403) msg = "Endpoint non autorisé par le proxy — ajoute \""+LIST_EP+"\" à la liste ALLOWED de api/proxy.js";
    throw new Error(msg);
  }
  return r.json();
}
async function fetchInvDetail(id){
window.__INVTOTAL__=window.__INVTOTAL__||{};
let all=[], skip=0, total=Infinity;
while(skip<total){
const j=await callProxy("/public/v2/inventories/"+id+"?skip="+skip+"&limit=100", null, "GET");
const arr=(j&&(j.data||(Array.isArray(j)?j:[])))||[];
total=(j&&typeof j.total==="number")?j.total:(skip+arr.length);
window.__INVTOTAL__[id]=total;
all=all.concat(arr);
if(arr.length<100) break;
skip+=100;
}
return { data: all };
}

// ===== Parse =====
function parseInv(o){
  const store = { name:(window.__STOREMAP__||{})[o.storeId] };
  const name = store.name || o.storeName || o.storeId || "—";
  let group, site;
  if(/^TFB\s+LAB/i.test(name)){ let raw = name.replace(/^TFB\s+LAB\s*/i,"").trim(); site = raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase(); group = /chalifert/i.test(name) ? "LAB Chalifert" : (/lognes/i.test(name) ? "LAB Lognes" : "LAB "+site); }
  else {
    site = name.replace(/^TFB\s+RESEAU\s*/i,"").trim();
    if(/bordeaux/i.test(name)) group="Bordeaux";
    else if(/lille/i.test(name)) group="Lille";
    else group="Paris";
  }
  return { id:o.id, name, site, group,
           ref:o.reference||"—",
           total:+(o.total)||0,
           date:o.inventoryDate||o.timestamp||o.createdAt,
           validated:!!o.isValidated };
}

// ===== Load =====
async function loadAll(since){
  setDot("spin", since ? "Mise à jour des inventaires…" : "Chargement des inventaires…");

// ===== Filters =====
function periodMatch(dateStr){
  if(S.period==="all") return true;
  const d=new Date(dateStr); if(isNaN(d)) return false;
  const now=new Date();
  if(S.period==="y") return d.getFullYear()===2026;
  if(S.period==="m0") return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  if(S.period==="m1"){ const m=new Date(now.getFullYear(),now.getMonth()-1,1);
    return d.getFullYear()===m.getFullYear() && d.getMonth()===m.getMonth(); }
  return true;
}
function applyFilters(){
  const q=S.q.toLowerCase();
  S.filtered = S.all.filter(r=>
    (S.group==="ALL" || r.group===S.group) &&
    (!S.site || r.site===S.site) &&
    periodMatch(r.date) &&
    (!q || r.site.toLowerCase().includes(q) || r.ref.toLowerCase().includes(q))
  );
  renderMetrics();
  renderPanel();
}

// Latest inventory per site within the filtered set
function latestPerSite(rows){
  const m={};
  rows.forEach(r=>{ const k=r.site; if(!m[k] || new Date(r.date)>new Date(m[k].date)) m[k]=r; });
  return Object.values(m);
}

async function boot(){
  let snap = null;
  try{ snap = await cacheGet("inventaires"); }catch(e){ snap = null; }
  if(snap && snap.all && snap.all.length){
    S.all = snap.all;
    if(snap.storeMap && Object.keys(snap.storeMap).length) window.__STOREMAP__ = snap.storeMap;
    if(snap.spMap && Object.keys(snap.spMap).length) window.__SPMAP__ = snap.spMap;
    LAST_SYNC = snap.lastSync || null;
    if(snap.pf && Object.keys(snap.pf).length){ S.pf = snap.pf; }
    populateSites();
    setDot("ok", `<strong>${S.all.length}</strong> inventaires (cache) · ${new Set(S.all.map(r=>r.site)).size} sites — actualisation…`);
    applyFilters();
    if(!window.__CACHE_FRESH_LOCAL__) loadAll(LAST_SYNC || "2024-01-01");
  } else {
    loadAll(null);
  }
}
/* ==========================================================
   TFB - Inventaires : tout garder en cache
   Le detail de chaque inventaire (lignes) est desormais
   persiste dans le cache. Consequences :
   - plus aucun appel API au demarrage si le cache est complet
     (avant : 1 appel par inventaire, soit des centaines)
   - ouvrir une ligne est instantane
   Le bouton Actualiser n invalide que ce qui peut bouger
   (inventaires non valides ou datant de moins de 21 jours).
   ========================================================== */
(function(){
  var DET_KEY = 'inventaires-det-v1';
  var savedCount = -1, saving = false;

  function todayISO(){ return new Date().toISOString().slice(0,10); }

  window.__DETREADY = (async function(){
    try{
      var d = await cacheGet(DET_KEY);
      if(d && d.det){
        var n = 0;
        Object.keys(d.det).forEach(function(k){ if(!detCache[k]){ detCache[k] = d.det[k]; n++; } });
        if(d.totals){ window.__INVTOTAL__ = window.__INVTOTAL__ || {}; Object.keys(d.totals).forEach(function(k){ if(window.__INVTOTAL__[k] === undefined) window.__INVTOTAL__[k] = d.totals[k]; }); }
        savedCount = Object.keys(detCache).length;
        console.log('Inventaires : ' + n + ' details repris du cache');
      }
    }catch(e){ console.warn('detCache', e); }
  })();

  function saveDet(){
    try{
      var n = Object.keys(detCache).length;
      if(!n || n === savedCount || saving) return;
      saving = true; savedCount = n;
      Promise.resolve(cacheSet(DET_KEY, { det:detCache, totals:window.__INVTOTAL__||{}, lastSync:todayISO() }))
        .then(function(){ saving = false; }, function(){ saving = false; });
    }catch(e){ saving = false; }
  }
  window.__saveDet = saveDet;

  var origPF = window.loadPFFlags;
  if(typeof origPF === 'function'){
    window.loadPFFlags = async function(){
      try{ await window.__DETREADY; }catch(e){}
      /* si la table des supplier-products vient du cache, inutile d attendre 20s */
      if(window.__SPMAP_INCOMPLETE__ === undefined && Object.keys(window.__SPMAP__||{}).length) window.__SPMAP_INCOMPLETE__ = false;
      var ids = (S.all||[]).map(function(r){ return r.id; });
      var manquants = ids.filter(function(id){ return !detCache[id]; });
      if(ids.length && !manquants.length){
        /* tout est deja en cache : aucun appel API */
        S.pf = S.pf || {};
        ids.forEach(function(id){ if(S.pf[id] === undefined){ try{ S.pf[id] = invCategory(detCache[id]); }catch(e){} } });
        S.pfLoading = false; S.pfDone = true;
        try{ fillPFCells(); }catch(e){}
        try{
          var sb = document.getElementById('sh-sub');
          if(sb && S.tab === 'liste') sb.textContent = S.filtered.length + (S.filtered.length > 1 ? ' lignes' : ' ligne');
        }catch(e){}
        saveDet();
        return;
      }
      var r = await origPF.apply(this, arguments);
      saveDet();
      return r;
    };
  }

  var origTD = window.toggleDetail;
  if(typeof origTD === 'function'){
    window.toggleDetail = async function(){
      try{ await window.__DETREADY; }catch(e){}
      var r = await origTD.apply(this, arguments);
      saveDet();
      return r;
    };
  }

  var btn = document.getElementById('btn-reload');
  if(btn){
    btn.addEventListener('click', function(){
      try{
        var lim = new Date(Date.now() - 14*86400000).toISOString().slice(0,10);
        var purge = 0;
        (S.all||[]).forEach(function(r){
          var d = String(r.date||'').slice(0,10);
          if(d >= lim && detCache[r.id]){
            delete detCache[r.id];
            if(S.pf) delete S.pf[r.id];
            purge++;
          }
        });
        S.pfDone = false; S.pfLoading = false; savedCount = -1;
        console.log('Actualiser : ' + purge + ' details a recharger');
      }catch(e){}
    });
  }
})();
boot();
</script>

<script>/* Tri des tableaux de détail (clic sur l'en-tête). N'interfère pas avec les tableaux
   qui gèrent déjà leur tri (en-têtes munis de data-k). Colonnes .num triées numériquement. */
(function(){
  if(window.__detailSort)return; window.__detailSort=true;
  var THSEL="table.cd-tbl th,table.det-tbl th";
  function parseNum(txt){
    var t=String(txt).replace(/[^0-9.,\-]/g,""); if(!t)return null;
    if(t.indexOf(",")>-1 && t.indexOf(".")>-1){ t=t.replace(/\./g,"").replace(",","."); }
    else { t=t.replace(",","."); }
    var v=parseFloat(t); return isNaN(v)?null:v;
  }
  function isTot(r){ return /(^|\s)(det-tot|cd-tot|md-tot|tot|total)(\s|$)/i.test(r.className) || r.cells.length<=1; }
  function colIndex(th){ return [].indexOf.call(th.parentNode.children, th); }
  document.addEventListener("click", function(e){
    var th=e.target.closest(THSEL); if(!th) return;
    if(th.hasAttribute("data-k")) return;          // tableau qui se trie déjà tout seul
    var table=th.closest("table"); if(!table) return;
    var tb=table.tBodies[0]; if(!tb) return;
    var hr=th.parentNode, idx=colIndex(th);
    var dir=(table.__sc===idx)?-(table.__sd||1):1; table.__sc=idx; table.__sd=dir;
    var numeric=th.classList.contains("num");
    if(!numeric){ var ok=0,n=0; [].forEach.call(tb.rows,function(r){ if(isTot(r)||!r.cells[idx])return; n++; if(parseNum(r.cells[idx].textContent)!=null)ok++; }); numeric=(n>0 && ok/n>0.6); }
    var rows=[].filter.call(tb.rows,function(r){return !isTot(r);});
    var pinned=[].filter.call(tb.rows,function(r){return isTot(r);});
    rows.sort(function(a,b){
      var x=a.cells[idx]?a.cells[idx].textContent.trim():"", y=b.cells[idx]?b.cells[idx].textContent.trim():"";
      if(numeric){ var nx=parseNum(x), ny=parseNum(y); nx=(nx==null?-Infinity:nx); ny=(ny==null?-Infinity:ny); return (nx-ny)*dir; }
      return x.localeCompare(y,"fr",{numeric:true,sensitivity:"base"})*dir;
    });
    rows.forEach(function(r){tb.appendChild(r);});
    pinned.forEach(function(r){tb.appendChild(r);});
    [].forEach.call(hr.cells,function(c){ var s=c.querySelector(".sortarr"); if(s)s.textContent=""; });
    var arr=th.querySelector(".sortarr");
    if(!arr){ arr=document.createElement("span"); arr.className="sortarr"; arr.style.marginLeft="4px"; arr.style.opacity=".65"; th.appendChild(arr); }
    arr.textContent=dir>0?"\u2191":"\u2193";
  }, false);
  var st=document.createElement("style");
  st.textContent="table.cd-tbl th,table.det-tbl th{cursor:pointer;user-select:none}table.cd-tbl th:hover,table.det-tbl th:hover{color:var(--tx,#111)}";
  document.head.appendChild(st);
})();</script>

<script>
/* TFB — Récap inventaire par sous-catégorie (aligné Inpulse). Ajout non-destructif : ne touche qu'au tableau de répartition de l'inventaire. */
(function(){
  var FMT=function(n){return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' \u20AC';}; var FMTQ=function(n){n=n||0; return new Intl.NumberFormat('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2}).format(n);};
  var srcShort=function(s){return (s||'').replace(/INVENTAIRE VENTE\s*\(/i,'').replace(/\)\s*$/,'').trim()||'\u2014';};
  var DET={},LAST=null,CATMAP=null;
  function proxy(ep){return fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:ep,method:'GET'})}).then(function(r){return r.json();});}
  function ensureCatMap(prods){
    if(!CATMAP){try{CATMAP=JSON.parse(localStorage.getItem('tfbc:spcat')||'{}');}catch(e){CATMAP={};}}
    var need=prods.some(function(p){return !CATMAP[p.supplierProductId];});
    if(!need) return Promise.resolve(CATMAP);
    var m={};
    function page(skip){return proxy('/public/v2/supplier-products?limit=100&skip='+skip).then(function(j){(j.data||[]).forEach(function(sp){m[sp.id]=sp.subCategory||'(Autre)';});if(skip+100<(j.total||0))return page(skip+100);});}
    return page(0).then(function(){CATMAP=m;try{localStorage.setItem('tfbc:spcat',JSON.stringify(m));}catch(e){}return m;});
  }
  var _fetch=window.fetch;
  window.fetch=function(url,opts){
    var isDetail=false,ep=null;
    try{if(typeof url==='string'&&url.indexOf('/api/proxy')>=0&&opts&&opts.body){var b=JSON.parse(opts.body);if(b.endpoint&&/\/public\/v2\/inventories\/[0-9a-f-]+$/.test(b.endpoint)){isDetail=true;ep=b.endpoint;}}}catch(e){}
    var pr=_fetch.apply(this,arguments);
    if(isDetail){pr=pr.then(function(res){var c=res.clone();c.json().then(function(j){var arr=(j&&j.data)||(Array.isArray(j)?j:null);if(arr&&arr.length){var id=arr[0].inventoryListId||ep.split('/').pop();DET[id]=(LAST===id?(DET[id]||[]):[]).concat(arr);LAST=id;scan();}}).catch(function(){});return res;});}
    return pr;
  };
  function build(tbl,prods){
    if(tbl.dataset.tfbSub==='1')return; var __exp=(window.__INVTOTAL__||{})[LAST]; if(__exp&&prods.length<__exp){tbl.dataset.tfbSub='';}else{tbl.dataset.tfbSub='1';}
    ensureCatMap(prods).then(function(map){
      var groups={},grand=0,grandQ=0;
      prods.forEach(function(p){var sub=map[p.supplierProductId]||'(Autre)';var line=(p.cost||0)*(p.quantity||0);grand+=line;grandQ+=(p.quantity||0);if(!groups[sub])groups[sub]={total:0,qty:0,items:[]};groups[sub].total+=line;groups[sub].qty+=(p.quantity||0);groups[sub].items.push({name:p.supplierProductName,qty:p.quantity,cost:p.cost,line:line,src:srcShort(p.storageAreaName)});});
      var order=Object.keys(groups).sort(function(a,b){return groups[b].total-groups[a].total;});
      var html='<tr><th>Cat\u00e9gorie</th><th class="num">Total HT</th><th class="num">Part</th></tr>';
      order.forEach(function(sub,gi){
        var g=groups[sub],pct=grand?Math.round(g.total/grand*100):0,bySrc={};
        g.items.forEach(function(i){bySrc[i.src]=(bySrc[i.src]||0)+i.line;});
        var multi=Object.keys(bySrc).length>1;
        var srcSum=multi?Object.keys(bySrc).map(function(s){return '('+s+') '+FMT(bySrc[s]);}).join(' \u00b7 '):'';
        html+='<tr class="tfb-cat" data-g="'+gi+'" style="cursor:pointer;font-weight:600"><td><span class="tfb-arw">\u25b8</span> '+sub+'</td><td class="num">'+FMTQ(g.qty)+'</td><td class="num">'+FMT(g.total)+'</td><td class="num">'+pct+'%</td></tr>';
        var inner=srcSum?'<div style="font-size:11px;color:#666;margin:2px 0 4px 14px">'+srcSum+'</div>':'';
        inner+='<table style="width:100%;font-size:12px;border-collapse:collapse"><tr><th style="text-align:left">Produit</th><th>Qt\u00e9</th><th class="num">PU HT</th><th class="num">Total</th>'+(multi?'<th>Source</th>':'')+'</tr>';
        g.items.sort(function(a,b){return b.line-a.line;}).forEach(function(it){inner+='<tr><td>'+it.name+'</td><td style="text-align:center">'+it.qty+'</td><td class="num">'+FMT(it.cost).replace(' \u20AC','')+'</td><td class="num">'+FMT(it.line)+'</td>'+(multi?'<td style="text-align:center">'+it.src+'</td>':'')+'</tr>';});
        inner+='</table>';
        html+='<tr class="tfb-det" data-g="'+gi+'" style="display:none"><td colspan="3" style="padding:4px 14px;background:#fafafa">'+inner+'</td></tr>';
      });
      html+='<tr style="font-weight:700;border-top:2px solid #000"><td>Total</td><td class="num">'+FMTQ(grandQ)+'</td><td class="num">'+FMT(grand)+'</td><td class="num">100%</td></tr>';
      tbl.innerHTML=html;
      tbl.querySelectorAll('tr.tfb-cat').forEach(function(r){r.addEventListener('click',function(){var gid=r.getAttribute('data-g'),d=tbl.querySelector('tr.tfb-det[data-g="'+gid+'"]'),a=r.querySelector('.tfb-arw');if(d.style.display==='none'){d.style.display='';a.textContent='\u25be';}else{d.style.display='none';a.textContent='\u25b8';}});});
    }).catch(function(){tbl.dataset.tfbSub='';});
  }
  function scan(){document.querySelectorAll('tr.det-row table.det-tbl').forEach(function(tbl){if(tbl.dataset.tfbSub==='1')return;var prods=LAST&&DET[LAST]?DET[LAST]:null;if(prods)build(tbl,prods);});}
  var mo=new MutationObserver(function(){scan();});
  mo.observe(document.documentElement,{childList:true,subtree:true});
})();

<style id="tfb-colfilt-fix">
/* Correction du bug visuel : la ligne de filtres de colonnes etait collee a
   top:33px alors que la ligne d en-tete ne mesure que ~25px. Les lignes du
   tableau defilaient donc dans l ecart d environ 8px entre les deux.
   On calcule la position exacte en JS et on bouche les deux jointures. */
#panel thead tr:first-child th{z-index:3}
#panel thead tr.colfilt th{top:var(--cft,24px)!important;z-index:2;border-bottom:0}
#panel thead tr.colfilt th::after{content:"";position:absolute;left:0;right:0;top:100%;height:3px;background:linear-gradient(var(--sur) 2px,var(--bor) 2px)}
</style>
<script>
(function(){
  function maj(){
    try{
      var p = document.getElementById('panel');
      if(!p) return;
      var r1 = p.querySelector('thead tr:first-child');
      if(!r1) return;
      var h = r1.getBoundingClientRect().height;
      if(h > 0) p.style.setProperty('--cft', Math.max(0, Math.floor(h) - 1) + 'px');
    }catch(e){}
  }
  var t = null;
  function sched(){ clearTimeout(t); t = setTimeout(maj, 60); }
  maj(); sched();
  window.addEventListener('resize', sched);
  window.addEventListener('load', sched);
  try{
    var p = document.getElementById('panel');
    if(p) new MutationObserver(sched).observe(p, { childList:true, subtree:true });
  }catch(e){}
})();
</script>
<style id="tfb-det-pies">
.det-inner{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.det-inner>.det-tbl{flex:0 0 auto}
.tfb-pies{display:flex;gap:14px;flex:1 1 560px;min-width:0;flex-wrap:wrap;padding-top:4px}

.tfb-pie-t{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);font-weight:700;margin-bottom:4px}

@media(max-width:900px){.det-inner{flex-direction:column}.tfb-pies{flex:0 0 auto;width:100%;flex-direction:column}.tfb-pie{flex:0 0 auto;width:330px;max-width:100%;min-width:0}.tfb-pie-c{height:230px}}
</style>
<script>
(function(){
  var PC=["#b5793a","#7f8c99","#cf9a55","#9daab4","#96632f","#63707c","#ddb87e","#b6c1c8","#7d5a3c","#87958d","#e6cfa8","#a7b3a9"];
  var UID=0;
  var nfQ=new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0});
  var nfE=new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
  function num(t){ var v=parseFloat(String(t||"").replace(/[^0-9,\-]/g,"").replace(",",".")); return isNaN(v)?0:v; }
  function mk(id,labels,data,eur){
    var el=document.getElementById(id); if(!el||typeof Chart==="undefined") return;
    var keep=[]; data.forEach(function(x,i){ if(x>0) keep.push(i); });
    if(!keep.length) return;
    keep.sort(function(a,b){ return data[b]-data[a]; });
    var L=keep.map(function(i){return labels[i];}), D=keep.map(function(i){return data[i];});
    var tot=D.reduce(function(s,x){return s+x;},0)||1;
    var f=function(x){ return eur?nfE.format(x):nfQ.format(x); };
    new Chart(el,{type:"doughnut",
      data:{labels:L,datasets:[{data:D,backgroundColor:L.map(function(x,i){return PC[i%PC.length];}),borderWidth:3,borderColor:"#fff"}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"52%",animation:{duration:300},plugins:{
        legend:{position:"right",labels:{font:{size:11},padding:8,boxWidth:12,
          generateLabels:function(ch){ return ch.data.labels.map(function(l,i){ return {text:l+" \u2014 "+f(ch.data.datasets[0].data[i]),fillStyle:PC[i%PC.length],strokeStyle:PC[i%PC.length],hidden:false,index:i}; }); }}},
        tooltip:{callbacks:{label:function(c){ return c.label+" : "+f(c.parsed)+" ("+Math.round(c.parsed/tot*100)+"%)"; }}}
      }}});
  }
  function build(inner){
    if(!inner || inner.querySelector(".tfb-pies")) return;
    var rows=[].slice.call(inner.querySelectorAll("tr.det-cat"));
    if(!rows.length) return;
    var labels=[],qs=[],es=[];
    rows.forEach(function(tr){ var td=tr.querySelectorAll("td"); if(td.length<3) return;
      labels.push(tr.getAttribute("data-cat")||"Autres"); qs.push(num(td[1].textContent)); es.push(num(td[2].textContent)); });
    if(!labels.length) return;
    var n=++UID, i1="tfb-pq-"+n, i2="tfb-pe-"+n;
    var box=document.createElement("div"); box.className="tfb-pies";
    box.innerHTML='<div class="tfb-pie"><div class="tfb-pie-t">Répartition des quantités</div><div class="tfb-pie-c"><canvas id="'+i1+'"></canvas></div></div>'
      +'<div class="tfb-pie"><div class="tfb-pie-t">Répartition du total HT</div><div class="tfb-pie-c"><canvas id="'+i2+'"></canvas></div></div>';
    inner.appendChild(box);
    mk(i1,labels,qs,false); mk(i2,labels,es,true);
  }
  var prev=window.toggleDetail;
  if(typeof prev==="function"){
    window.toggleDetail=async function(id,cell){
      var r=await prev.apply(this,arguments);
      try{ var tr=cell.closest("tr"); var det=tr.nextElementSibling;
        if(det && det.classList.contains("det-row") && det.style.display!=="none") build(det.querySelector(".det-inner"));
      }catch(e){}
      return r;
    };
  }
})();
</script>

<script>
/* ============================================================
   TFB - Inventaires : colonne "Categorie manuelle"
   Liste deroulante alimentee par les modeles d inventaires Inpulse.
   Choix memorise en local (localStorage).
   ============================================================ */
(function(){
  var KEY="tfb_mcat_v1", MAP={};
  try{ MAP=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ MAP={}; }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(MAP)); }catch(e){} }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  // Options = uniquement le mois et l'annee (ex "juin 2026"), generes depuis les dates des inventaires (S.all), du plus recent au plus ancien.
  function monthOpts(){
    var rows=[]; try{ rows=(typeof S!=="undefined"&&S&&S.all)?S.all:[]; }catch(e){ rows=[]; }
    var set={};
    for(var i=0;i<rows.length;i++){
      var d=new Date(rows[i]&&rows[i].date); if(isNaN(d)) continue;
      var key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      if(!set[key]) set[key]=d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
    }
    return Object.keys(set).sort().reverse().map(function(k){ return set[k]; });
  }
  window.__MCAT_MONTHS=monthOpts;
  window.__mcGet=function(id){ return MAP[id]||""; };
  window.__mcSelHtml=function(id){
    var cur=MAP[id]||"", h="", opts=monthOpts();
    if(cur && opts.indexOf(cur)===-1) opts=opts.concat([cur]); // conserve un ancien choix hors liste
    h+="<select class=\"mc-sel"+(cur?"":" mc-empty")+"\" data-mcid=\""+esc(id)+"\">";
    h+="<option value=\"\">—</option>";
    for(var i=0;i<opts.length;i++){ h+="<option value=\""+esc(opts[i])+"\""+(opts[i]===cur?" selected":"")+">"+esc(opts[i])+"</option>"; }
    return h+"</select>";
  };
  function fill(){
    var cs=document.querySelectorAll("td.mc-cell");
    for(var i=0;i<cs.length;i++){
      var td=cs[i];
      if(td.querySelector("select.mc-sel")) continue;
      var id=td.getAttribute("data-mcrow")||"";
      if(!id){ var rc=td.parentNode?td.parentNode.querySelector(".ref-cell"):null; id=rc?(rc.getAttribute("data-id")||""):""; }
      if(id) td.innerHTML=window.__mcSelHtml(id);
    }
  }
  window.__mcFill=fill;
  var p=document.getElementById("panel");
  if(p){
    try{ new MutationObserver(function(){ fill(); }).observe(p,{childList:true}); }catch(e){}
    fill();
  }
  if(p) p.addEventListener("change",function(e){
    var s=(e.target&&e.target.closest)?e.target.closest("select.mc-sel"):null;
    if(!s) return;
    var id=s.getAttribute("data-mcid"); if(!id) return;
    if(s.value){ MAP[id]=s.value; } else { delete MAP[id]; }
    s.classList.toggle("mc-empty",!s.value);
    save();
  });
})();
</script>
