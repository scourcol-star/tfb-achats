<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TFB — RFA</title>
<!-- Mêmes dépendances que le reste de l'app -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  :root{
    --gold:#c8a96e; --gdark:#a8893e; --gbg:#faf6ee;
    --tx:#1a1a18; --tx2:#6b6860; --tx3:#9b9890;
    --bg:#f7f5f0; --sur:#fff; --sur2:#f2f0eb;
    --bor:#e4e0d8; --bor2:#d4cfc5;
    --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --r:10px; --rs:6px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Inter,sans-serif; color:var(--tx); background:var(--bg); }

  /* En-tete (repris a l'identique de l'app) */
  .topbar{background:var(--sur);border-bottom:1px solid var(--bor);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .topbar-l{display:flex;align-items:center;gap:18px;}
  .logo-link{display:inline-flex;align-items:center;text-decoration:none}
  .logo-img{height:30px;width:auto;display:block}
  .badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--gbg);color:var(--gdark);border:1px solid #e8d9b8;}
  .pagenav{display:flex;gap:2px;background:var(--sur2);border-radius:var(--rs);padding:3px;}
  .pagenav a{font-size:12px;font-weight:500;padding:5px 12px;border-radius:4px;color:var(--tx2);text-decoration:none;}
  .pagenav a.active{background:var(--tx);color:#fff;}
  .pagenav a:hover:not(.active){background:#e9e6df;color:var(--tx);}
  .topbar-r{display:flex;align-items:center;gap:8px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);border:1px solid var(--bor2);background:var(--sur);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap;font-family:inherit;}
  .btn:hover{background:var(--sur2);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  .btn-gold:hover{background:var(--gdark);}
  .btn-sm{padding:5px 10px;font-size:12px;}

  .wrap{ padding:20px 22px 48px; max-width:1400px; margin:0 auto; }
  .status{ background:var(--sur); border:1px solid var(--bor); border-radius:var(--r); padding:12px 16px; font-size:13px; display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px #eaf6ee; }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  select.sel{ font:inherit; font-size:13px; background:var(--sur); border:1px solid var(--bor); border-radius:var(--rs); padding:8px 12px; color:var(--tx); }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi{ background:var(--sur); border:1px solid var(--bor); border-radius:var(--r); padding:16px 18px; }
  .kpi.tint{ background:var(--gbg); border-color:#ecdfc4; }
  .kpi .l{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--tx3); margin-bottom:8px; }
  .kpi .v{ font-size:24px; font-weight:700; color:var(--gdark); }
  .kpi .s{ font-size:12px; color:var(--tx2); margin-top:3px; }

  .card{ background:var(--sur); border:1px solid var(--bor); border-radius:var(--r); margin-bottom:20px; overflow:hidden; }
  .card-h{ padding:14px 18px; border-bottom:1px solid var(--bor); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .card-h h3{ margin:0; font-size:15px; font-weight:700; }
  .card-h .muted{ font-size:12px; color:var(--tx2); }
  .card-b{ padding:18px; }

  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field .fl{ font-size:12px; color:var(--tx2); font-weight:500; }
  .field input, .field select{ font:inherit; font-size:13px; background:var(--sur); border:1px solid var(--bor2); border-radius:var(--rs); padding:8px 10px; color:var(--tx); width:100%; }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gbg); }
  .seg{ display:flex; border:1px solid var(--bor2); border-radius:var(--rs); overflow:hidden; }
  .seg button{ flex:1; font:inherit; font-size:12px; border:0; background:var(--sur); color:var(--tx2); padding:8px 6px; cursor:pointer; }
  .seg button.on{ background:var(--tx); color:#fff; font-weight:600; }

  .preview{ margin-top:16px; padding:14px 16px; background:var(--gbg); border:1px solid #ecdfc4; border-radius:var(--r); display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
  .preview .pl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gdark); }
  .preview .pv{ font-size:20px; font-weight:700; }
  .form-actions{ margin-top:16px; display:flex; gap:10px; }

  table.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--tx3); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--bor); white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--sur2); vertical-align:middle; }
  .tbl tr:hover td{ background:#fbfaf7; }
  .num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .ib{ border:1px solid var(--bor); background:var(--sur); border-radius:var(--rs); padding:5px 8px; font:inherit; font-size:12px; cursor:pointer; color:var(--tx2); }
  .ib:hover{ border-color:var(--bor2); color:var(--tx); }
  .empty{ padding:40px; text-align:center; color:var(--tx2); font-size:13px; }
  .bar{ height:5px; border-radius:3px; background:var(--sur2); overflow:hidden; margin-top:4px; }
  .bar > i{ display:block; height:100%; background:var(--gold); }

  @media(max-width:900px){ .grid{ grid-template-columns:repeat(2,1fr);} .topbar{height:auto;min-height:52px;flex-wrap:wrap;row-gap:8px;padding:8px 12px;} .topbar-l,.topbar-r{flex-wrap:wrap;gap:8px} .logo-img{height:24px} }
</style>
</head>

  <div class="wrap">
    <div class="status"><span class="dot"></span><span id="statusLine"></span></div>

    <div class="filters">
      <select class="sel" id="fFourn" onchange="render()"></select>
      <select class="sel" id="fStatut" onchange="render()">
        <option value="tous">Tous statuts</option>
        <option value="encours">En cours</option>
        <option value="avenir">À venir</option>
        <option value="echue">Échues</option>
      </select>
    </div>

    <div class="kpis" id="kpis"></div>

    <!-- Formulaire -->
    <div class="card">
      <div class="card-h">
        <h3 id="formTitle">Nouvelle RFA</h3>
        <span class="muted">Choisissez une référence : fournisseur, catégorie, unité et volumes se remplissent automatiquement.</span>
      </div>
      <div class="card-b">
        <div class="grid">
          <label class="field">
            <span class="fl">Portée</span>
            <div class="seg" id="segPortee">
              <button data-v="reference" class="on" onclick="setPortee('reference')">Par référence</button>
              <button data-v="fournisseur" onclick="setPortee('fournisseur')">Par fournisseur</button>
            </div>
          </label>

          <label class="field" style="grid-column:span 2" id="wrapRef">
            <span class="fl">Référence (matière)</span>
            <select id="inRef" onchange="pickRef(this.value)"></select>
          </label>
          <label class="field" style="grid-column:span 2; display:none" id="wrapFournSel">
            <span class="fl">Fournisseur</span>
            <select id="inFournSel" onchange="setVal('fournisseur', this.value)"></select>
          </label>

          <label class="field">
            <span class="fl">Fournisseur</span>
            <input id="inFourn" placeholder="—" oninput="setVal('fournisseur', this.value)" />
          </label>

          <label class="field"><span class="fl">Date de début</span><input type="date" id="inDebut" value="2026-01-01" oninput="setVal('dateDebut', this.value)" /></label>
          <label class="field"><span class="fl">Date de fin</span><input type="date" id="inFin" value="2026-12-31" oninput="setVal('dateFin', this.value)" /></label>

          <label class="field">
            <span class="fl">Base de calcul</span>
            <div class="seg" id="segBase">
              <button data-v="bdc" class="on" onclick="setBase('bdc')">Qté commandée</button>
              <button data-v="recue" onclick="setBase('recue')">Qté reçue</button>
            </div>
          </label>
          <label class="field"><span class="fl" id="lblQte">Quantités</span><input type="number" id="inQte" placeholder="0" oninput="setVal('quantite', this.value)" /></label>

          <label class="field">
            <span class="fl">Type de remise</span>
            <div class="seg" id="segType">
              <button data-v="unitaire" class="on" onclick="setType('unitaire')">Unitaire €</button>
              <button data-v="pct" onclick="setType('pct')">% du HT</button>
            </div>
          </label>
          <label class="field" id="wrapUnit"><span class="fl">Remise unitaire (€ / unité)</span><input type="number" step="0.01" id="inUnit" placeholder="0,00" oninput="setVal('remiseUnit', this.value)" /></label>
          <label class="field" id="wrapPct" style="display:none"><span class="fl">Taux de remise (%)</span><input type="number" step="0.1" id="inPct" placeholder="0,0" oninput="setVal('tauxPct', this.value)" /></label>

          <label class="field"><span class="fl">Montant total (override facultatif)</span><input type="number" id="inManuel" placeholder="auto" oninput="setVal('montantManuel', this.value)" /></label>
          <label class="field" style="grid-column:span 3"><span class="fl">Notes</span><input id="inNotes" placeholder="Conditions, palier, contact…" oninput="setVal('notes', this.value)" /></label>
        </div>

        <div class="preview">
          <div><div class="pl">Acquis à ce jour</div><div class="pv" id="pvAcq">—</div></div>
          <div><div class="pl">Statut</div><div class="pv" style="font-size:15px"><span id="pvStatut" class="badge"></span></div></div>
        </div>

        <div class="form-actions">
          <button class="btn gold" id="saveBtn" onclick="save()"><i class="ti ti-plus"></i><span id="saveLbl">Ajouter la RFA</span></button>
          <button class="btn" id="cancelBtn" onclick="cancel()" style="display:none">Annuler</button>
        </div>
      </div>
    </div>

    <!-- Tableau -->
    <div class="card">
      <div class="card-h"><h3>Accords RFA</h3><span class="muted" id="tblCount"></span></div>
      <div id="tblHost"></div>
    </div>
  </div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   BRANCHER (1) — Catalogue des références (extrait réel de l'app).
   Remplacez ce tableau par vos 387 réfs de l'onglet « Par matière »
   (nom, categorie, fournisseur, unite, qteBdc, qteRecue, montantHt).
   ═══════════════════════════════════════════════════════════════════════ */
let REFERENCES = [
  { id:"r1", nom:"BEURRE TOURAGE",             categorie:"BOF",         fournisseur:"ISIGNY SAINTE MERE", unite:"kg", qteBdc:27540,  qteRecue:17390,  montantHt:272646 },
  { id:"r2", nom:"BEURRE CUBE",                categorie:"BOF",         fournisseur:"DELON",              unite:"kg", qteBdc:24400,  qteRecue:52000,  montantHt:112300 },
  { id:"r3", nom:"FILET DE POULET CUIT HALAL", categorie:"CHARCUTERIE", fournisseur:"FUSEAU",             unite:"kg", qteBdc:9818,   qteRecue:13938,  montantHt:106520 },
  { id:"r4", nom:"FARINE TRADITION - T65",     categorie:"FARINE",      fournisseur:"FUSEAU",             unite:"kg", qteBdc:54819,  qteRecue:32159,  montantHt:89834  },
  { id:"r5", nom:"CAPSULE CAFE FORTE X50",     categorie:"CONS/HYGIENE",fournisseur:"NESPRESSO",          unite:"u",  qteBdc:108400, qteRecue:121550, montantHt:87024  },
];
let FOURNISSEURS = [...new Set(REFERENCES.map(r => r.fournisseur))].sort();

  /* -- Catalogue complet (partage avec la page Fournisseurs) --
     On reutilise le meme cache serveur (/api/cache?key=fournisseurs) : toutes les
        references et tous les fournisseurs y sont deja presents. Les quantites
           commandees/recues et le montant HT ne sont pas fournis par ce cache (ce sont des
              agregats de commandes calcules dans "Achats bruts") : ils restent a 0 et peuvent
                 etre saisis manuellement dans le formulaire. */
  function shortUniteRfa(u){
      u = (u||"").toLowerCase();
      if(/kilogramme|\bkg\b/.test(u)) return "kg";
      if(/litre|\bl\b/.test(u)) return "L";
      if(/pi[eè]ce|unit[ée]/.test(u)) return "u";
      return (u||"u").slice(0,10);
  }
  async function chargerCatalogueComplet(){
      try{
            const r = await fetch(window.location.origin + "/api/cache?key=fournisseurs", { cache:"no-store" });
            if(!r.ok) return;
            const j = await r.json();
            if(!j || !j.dataB64) return;
            const bin = Uint8Array.from(atob(j.dataB64), c => c.charCodeAt(0));
            const snap = JSON.parse(pako.ungzip(bin, { to:"string" }));
            const rows = snap.rows || [];
            if(!rows.length) return;
            REFERENCES = rows.map(r => ({
                    id: r.id,
                    nom: r.ref,
                    categorie: r.cat || "",
                    fournisseur: r.supplier || "Inconnu",
                    unite: r.isKg ? "kg" : shortUniteRfa(r.unit),
                    qteBdc: 0, qteRecue: 0, montantHt: 0,
            }));
            const nomsFournisseurs = (snap.suppliers || []).map(s => s.name).filter(Boolean);
            FOURNISSEURS = [...new Set([...nomsFournisseurs, ...REFERENCES.map(r => r.fournisseur)])].sort((a,b)=>a.localeCompare(b,"fr"));
            fillSelects();
            render();
      }catch(e){ console.warn("Catalogue complet indisponible, utilisation de l'extrait de secours.", e); }
  }

/* BRANCHER (2) — RFA déjà enregistrées (remplacer par un fetch / stockage). */
let RFAS = [
  { id:"a1", portee:"reference", refId:"r1", fournisseur:"ISIGNY SAINTE MERE", categorie:"BOF", unite:"kg", base:"bdc", quantite:27540, typeRemise:"unitaire", remiseUnit:0.35, tauxPct:0,   dateDebut:"2026-01-01", dateFin:"2026-12-31", montantManuel:null, notes:"Accord annuel — palier 25 t atteint" },
  { id:"a2", portee:"fournisseur", refId:"", fournisseur:"FUSEAU",             categorie:"—",   unite:"€",  base:"ht",  quantite:0,     typeRemise:"pct",      remiseUnit:0,    tauxPct:2.5, dateDebut:"2026-01-01", dateFin:"2026-12-31", montantManuel:null, notes:"2,5 % du CA achats HT fournisseur" },
];

/* ── Format FR ── */
const euro  = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const eur2  = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const num   = n => new Intl.NumberFormat("fr-FR").format(Math.round(n||0));
const TODAY = new Date("2026-07-07");           // ← new Date() en prod
const dfmt  = iso => iso ? new Date(iso).toLocaleDateString("fr-FR") : "—";
const refById = id => REFERENCES.find(r => r.id === id);

/* ── Logique métier ── */
function montantPrevisionnel(r){
  if (r.montantManuel != null && r.montantManuel !== "") return Number(r.montantManuel);
  if (r.typeRemise === "unitaire") return (Number(r.quantite)||0) * (Number(r.remiseUnit)||0);
  if (r.portee === "reference"){ const x = refById(r.refId); return ((Number(r.tauxPct)||0)/100) * (x ? x.montantHt : 0); }
  const totalFourn = REFERENCES.filter(x => x.fournisseur === r.fournisseur).reduce((s,x)=>s+x.montantHt,0);
  return ((Number(r.tauxPct)||0)/100) * totalFourn;
}
function progression(r){ const d=new Date(r.dateDebut), f=new Date(r.dateFin); if(!(d<f)) return 0; return Math.min(1,Math.max(0,(TODAY-d)/(f-d))); }
function acquis(r){ return montantPrevisionnel(r) * progression(r); }
function statut(r){
  const d=new Date(r.dateDebut), f=new Date(r.dateFin);
  if (TODAY < d) return { key:"avenir",  label:"À venir",  color:"var(--tx2)",  bg:"var(--sur2)" };
  if (TODAY > f) return { key:"echue",   label:"Échue",    color:"var(--tx3)",  bg:"var(--sur2)" };
  return               { key:"encours", label:"En cours", color:"var(--green)",bg:"#eaf6ee" };
}
function joursRestants(r){ return Math.ceil((new Date(r.dateFin)-TODAY)/86400000); }
const labelRfa = r => r.portee === "reference" ? (refById(r.refId)?.nom || "—") : ("Tous · " + r.fournisseur);

/* ── État du formulaire ── */
const EMPTY = { portee:"reference", refId:"", fournisseur:"", categorie:"", unite:"", base:"bdc", quantite:"", typeRemise:"unitaire", remiseUnit:"", tauxPct:"", dateDebut:"2026-01-01", dateFin:"2026-12-31", montantManuel:"", notes:"" };
let form = {...EMPTY};
let editId = null;

const $ = id => document.getElementById(id);
function setVal(k,v){ form[k]=v; renderPreview(); }
function setPortee(p){
  form.portee=p;
  document.querySelectorAll('#segPortee button').forEach(b=>b.classList.toggle('on', b.dataset.v===p));
  $("wrapRef").style.display = p==="reference" ? "" : "none";
  $("wrapFournSel").style.display = p==="fournisseur" ? "" : "none";
  renderPreview();
}
function pickRef(id){
  const r = refById(id); form.refId=id;
  if(r){ form.fournisseur=r.fournisseur; form.categorie=r.categorie; form.unite=r.unite; form.quantite = form.base==="recue"?r.qteRecue:r.qteBdc; }
  syncForm();
}
function setBase(b){
  form.base=b;
  document.querySelectorAll('#segBase button').forEach(x=>x.classList.toggle('on', x.dataset.v===b));
  const r = refById(form.refId); if(r){ form.quantite = b==="recue"?r.qteRecue:r.qteBdc; }
  syncForm();
}
function setType(t){
  form.typeRemise=t;
  document.querySelectorAll('#segType button').forEach(x=>x.classList.toggle('on', x.dataset.v===t));
  $("wrapUnit").style.display = t==="unitaire" ? "" : "none";
  $("wrapPct").style.display  = t==="pct" ? "" : "none";
  renderPreview();
}
/* Recopie l'état -> champs (après auto-remplissage) */
function syncForm(){
  $("inFourn").value = form.fournisseur||"";
  $("inFournSel").value = form.fournisseur||"";
  $("inQte").value = form.quantite||"";
  $("inUnit").value = form.remiseUnit||"";
  $("inPct").value = form.tauxPct||"";
  $("inManuel").value = form.montantManuel||"";
  $("inNotes").value = form.notes||"";
  $("inDebut").value = form.dateDebut||"";
  $("inFin").value = form.dateFin||"";
  $("inRef").value = form.refId||"";
  $("lblQte").textContent = "Quantités (" + (form.unite||"u") + ")";
  renderPreview();
}
function renderPreview(){
  const prev = montantPrevisionnel(form);
  $("pvPrev").textContent = euro(prev);
  $("pvAcq").textContent  = euro(prev*progression(form));
  const s = statut(form);
  const el = $("pvStatut"); el.textContent = s.label; el.style.color=s.color; el.style.background=s.bg;
  $("lblQte").textContent = "Quantités (" + (form.unite||"u") + ")";
  const valid = form.portee==="reference" ? form.refId : form.fournisseur;
  $("saveBtn").disabled = !valid;
}
function cancel(){ form={...EMPTY}; editId=null; resetFormUI(); }
function resetFormUI(){
  setPortee(form.portee); setBase(form.base); setType(form.typeRemise);
  syncForm();
  $("formTitle").textContent = editId ? "Modifier la RFA" : "Nouvelle RFA";
  $("saveLbl").textContent = editId ? "Enregistrer" : "Ajouter la RFA";
  $("cancelBtn").style.display = editId ? "" : "none";
}
function save(){
  const valid = form.portee==="reference" ? form.refId : form.fournisseur;
  if(!valid) return;
  if(editId){ RFAS = RFAS.map(x => x.id===editId ? {...form, id:editId} : x); }
  else { RFAS.push({...form, id:"a"+Date.now()}); }
  /* BRANCHER (3) : persister ici (API / stockage). */
  cancel(); render();
}
function edit(id){
  const r = RFAS.find(x=>x.id===id); if(!r) return;
  form = {...r}; editId=id; resetFormUI(); window.scrollTo({top:0,behavior:"smooth"});
}
function del(id){ RFAS = RFAS.filter(x=>x.id!==id); render(); }

/* ── Rendu ── */
function fillSelects(){
  $("inRef").innerHTML = '<option value="">— Choisir une réf —</option>' + REFERENCES.map(r=>`<option value="${r.id}">${r.nom}</option>`).join("");
  $("inFournSel").innerHTML = '<option value="">— Choisir un fournisseur —</option>' + FOURNISSEURS.map(f=>`<option value="${f}">${f}</option>`).join("");
  $("fFourn").innerHTML = '<option value="tous">Tous fournisseurs</option>' + FOURNISSEURS.map(f=>`<option value="${f}">${f}</option>`).join("");
}
function render(){
  const fF = $("fFourn").value, fS = $("fStatut").value;
  const visibles = RFAS.filter(r => (fS==="tous"||statut(r).key===fS) && (fF==="tous"||r.fournisseur===fF));

  const totalPrev = RFAS.reduce((s,r)=>s+montantPrevisionnel(r),0);
  const totalAcq  = RFAS.reduce((s,r)=>s+acquis(r),0);
  const actifs    = RFAS.filter(r=>statut(r).key==="encours").length;
  const echeances = RFAS.filter(r=>{const j=joursRestants(r); return j>=0&&j<=60;}).length;
  const m={}; RFAS.forEach(r=>m[r.fournisseur]=(m[r.fournisseur]||0)+montantPrevisionnel(r));
  const top = Object.entries(m).sort((a,b)=>b[1]-a[1])[0];

  $("statusLine").textContent = `${RFAS.length} accord${RFAS.length>1?"s":""} RFA · ${actifs} en cours · ${echeances} échéance${echeances>1?"s":""} sous 60 jours`;

  $("kpis").innerHTML = [
    ["RFA prévisionnelle", euro(totalPrev), "sur l'année", true],
    ["RFA acquise", euro(totalAcq), "prorata temporel", false],
    ["Accords actifs", num(actifs), RFAS.length+" au total", false],
    ["Échéances < 60 j", num(echeances), "à relancer", false],
    ["Top fournisseur", top?top[0]:"—", top?euro(top[1]):"", false],
  ].map(([l,v,s,t])=>`<div class="kpi ${t?'tint':''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

  $("tblCount").textContent = `${visibles.length} affiché${visibles.length>1?"s":""}`;
  if(!visibles.length){ $("tblHost").innerHTML = '<div class="empty">Aucune RFA pour ces filtres. Ajoutez-en une avec le formulaire ci-dessus.</div>'; return; }

  const rows = visibles.map(r=>{
    const s=statut(r), prev=montantPrevisionnel(r), acq=acquis(r), pr=Math.round(progression(r)*100);
    const remise = r.typeRemise==="unitaire" ? `${eur2(r.remiseUnit)} / ${r.unite}` : `${num(r.tauxPct)} % HT`;
    const base = r.typeRemise==="unitaire" ? `${num(r.quantite)} ${r.unite}` : "—";
    return `<tr>
      <td style="font-weight:600">${labelRfa(r)}</td>
      <td>${r.fournisseur}</td>
      <td style="color:var(--tx2)">${r.categorie||"—"}</td>
      <td style="color:var(--tx2);white-space:nowrap">${dfmt(r.dateDebut)} → ${dfmt(r.dateFin)}</td>
      <td>${remise}</td>
      <td class="num">${base}</td>
      <td class="num" style="font-weight:600;color:var(--gdark)">${euro(prev)}</td>
      <td class="num">${euro(acq)}<div class="bar"><i style="width:${pr}%"></i></div></td>
      <td><span class="badge" style="color:${s.color};background:${s.bg}">${s.label}</span></td>
      <td class="num"><button class="ib" onclick="edit('${r.id}')"><i class="ti ti-pencil"></i></button> <button class="ib" onclick="del('${r.id}')"><i class="ti ti-trash"></i></button></td>
    </tr>`;
  }).join("");

  $("tblHost").innerHTML = `<table class="tbl"><thead><tr>
      <th>Référence / portée</th><th>Fournisseur</th><th>Catégorie</th><th>Période</th>
      <th>Remise</th><th class="num">Base</th><th class="num">Prévisionnel</th><th class="num">Acquis</th><th>Statut</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

/* ── Export CSV ── */
function exportCSV(){
  const head = ["Référence/portée","Fournisseur","Catégorie","Début","Fin","Type","Remise","Base qté","Montant prévisionnel","Acquis","Statut","Notes"];
  const lines = RFAS.map(r=>[
    labelRfa(r), r.fournisseur, r.categorie, r.dateDebut, r.dateFin,
    r.typeRemise==="unitaire"?"unitaire":"%HT",
    r.typeRemise==="unitaire"?r.remiseUnit:r.tauxPct,
    r.typeRemise==="unitaire"?r.quantite:"",
    Math.round(montantPrevisionnel(r)), Math.round(acquis(r)), statut(r).label, (r.notes||"").replace(/"/g,'""')
  ].map(v=>`"${v}"`).join(";"));
  const csv = "\uFEFF" + [head.join(";"), ...lines].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "rfa.csv"; a.click(); URL.revokeObjectURL(a.href);
}

/* ── Init ── */
fillSelects();
resetFormUI();
render();
  chargerCatalogueComplet();
</script>
</body>
</html>
