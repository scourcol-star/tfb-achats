<meta charset="utf-8" />

<!-- Mêmes dépendances que le reste de l'app -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  :root{
    --gold:#c8a96e; --gdark:#a8893e; --gbg:#faf6ee;
    --tx:#1a1a18; --tx2:#6b6860; --tx3:#9b9890;
    --bg:#f7f5f0; --sur:#fff; --sur2:#f2f0eb;
    --bor:#e4e0d8; --bor2:#d4cfc5;
    --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --r:10px; --rs:6px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Inter,sans-serif; color:var(--tx); background:var(--bg); }

  /* En-tete (repris a l'identique de l'app) */
  .topbar{background:var(--sur);border-bottom:1px solid var(--bor);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .topbar-l{display:flex;align-items:center;gap:18px;}
  .logo-link{display:inline-flex;align-items:center;text-decoration:none}
  .logo-img{height:30px;width:auto;display:block}
  .badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--gbg);color:var(--gdark);border:1px solid #e8d9b8;}
  .pagenav{display:flex;gap:2px;background:var(--sur2);border-radius:var(--rs);padding:3px;}
  .pagenav a{font-size:12px;font-weight:500;padding:5px 12px;border-radius:4px;color:var(--tx2);text-decoration:none;}
  .pagenav a.active{background:var(--amber);color:#fff;}
  .pagenav a:hover:not(.active){background:#e9e6df;color:var(--tx);}
  .topbar-r{display:flex;align-items:center;gap:8px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);border:1px solid var(--bor2);background:var(--sur);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap;font-family:inherit;}
  .btn:hover{background:var(--sur2);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-gold{background:var(--amber);color:#fff;border-color:var(--amber);}
  .btn-gold:hover{background:#b45f04;border-color:#b45f04;}
  .btn-sm{padding:5px 10px;font-size:12px;}

  .wrap{ padding:20px 22px 48px; max-width:1400px; margin:0 auto; }
  .status{ background:var(--sur); border:1px solid var(--bor); border-radius:var(--r); padding:12px 16px; font-size:13px; display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px #eaf6ee; }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  select.sel{ font:inherit; font-size:13px; background:var(--sur); border:1px solid var(--bor); border-radius:var(--rs); padding:8px 12px; color:var(--tx); }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .kpi{ background:var(--sur); border:1px solid var(--bor); border-radius:var(--r); padding:16px 18px; }
  .kpi.tint{ background:var(--gbg); border-color:#ecdfc4; }
  .kpi .l{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--tx3); margin-bottom:8px; }
  .kpi .v{ font-size:24px; font-weight:700; color:var(--gdark); }
  .kpi .s{ font-size:12px; color:var(--tx2); margin-top:3px; }

  .card{ background:var(--sur); border:1px solid var(--bor); border-radius:var(--r); margin-bottom:20px; overflow:hidden; }
  .card-h{ padding:14px 18px; border-bottom:1px solid var(--bor); display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .card-h h3{ margin:0; font-size:15px; font-weight:700; }
  .card-h .muted{ font-size:12px; color:var(--tx2); }
  .card-b{ padding:18px; }

  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field .fl{ font-size:12px; color:var(--tx2); font-weight:500; }
  .field input, .field select{ font:inherit; font-size:13px; background:var(--sur); border:1px solid var(--bor2); border-radius:var(--rs); padding:8px 10px; color:var(--tx); width:100%; }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gbg); }
  .seg{ display:flex; border:1px solid var(--bor2); border-radius:var(--rs); overflow:hidden; }
  .seg button{ flex:1; font:inherit; font-size:12px; border:0; background:var(--sur); color:var(--tx2); padding:8px 6px; cursor:pointer; }
  .seg button.on{ background:var(--amber); color:#fff; font-weight:600; }

  .preview{ margin-top:16px; padding:14px 16px; background:var(--gbg); border:1px solid #ecdfc4; border-radius:var(--r); display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
  .preview .pl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--gdark); }
  .preview .pv{ font-size:20px; font-weight:700; }
  .form-actions{ margin-top:16px; display:flex; gap:10px; }

  table.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th{ text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--tx3); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--bor); white-space:nowrap; }
  .tbl td{ padding:11px 12px; border-bottom:1px solid var(--sur2); vertical-align:middle; }
  .tbl tr:hover td{ background:#fbfaf7; }
  .num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .ib{ border:1px solid var(--bor); background:var(--sur); border-radius:var(--rs); padding:5px 8px; font:inherit; font-size:12px; cursor:pointer; color:var(--tx2); }
  .ib:hover{ border-color:var(--bor2); color:var(--tx); }
  .empty{ padding:40px; text-align:center; color:var(--tx2); font-size:13px; }
  .bar{ height:5px; border-radius:3px; background:var(--sur2); overflow:hidden; margin-top:4px; }
  .bar > i{ display:block; height:100%; background:var(--gold); } .miniProgWrap{ display:inline-flex; align-items:center; } .miniProgTrack{ width:70px; height:6px; background:var(--sur2); border-radius:3px; overflow:hidden; } .miniProgBar{ display:block; height:100%; width:100%; background:linear-gradient(90deg, var(--gold) 0%, var(--gbg) 50%, var(--gold) 100%); background-size:200% 100%; animation:miniProgAnim 1.1s linear infinite; } @keyframes miniProgAnim{ 0%{ background-position:0% 0; } 100%{ background-position:200% 0; } }

  @media(max-width:900px){ .grid{ grid-template-columns:repeat(2,1fr);} .topbar{height:auto;min-height:52px;flex-wrap:wrap;row-gap:8px;padding:8px 12px;} .topbar-l,.topbar-r{flex-wrap:wrap;gap:8px} .logo-img{height:24px} }
</style>
<style id="tfb-wip-nav">
/* CHANTIER : onglet Inventaires grise (page non fonctionnelle) */
.pagenav a.nav-wip{color:var(--tx3) !important;opacity:.6;font-style:italic}
.pagenav a.nav-wip:hover{background:transparent !important;color:var(--tx3) !important}
.pagenav a.nav-wip.active{background:var(--tx3) !important;color:#fff !important;opacity:.75;font-style:normal}
</style>
</head>

      <select class="sel" id="fRef" onchange="render()"></select>

    <!-- Formulaire -->
    <div class="card">
      <div class="card-h" style="cursor:pointer" onclick="basculerFormRfa()">
        <h3 id="formTitle">Nouvelle RFA</h3>
        <span class="muted">Choisissez une référence : fournisseur, catégorie, unité et volumes se remplissent automatiquement.</span>
        <button class="btn btn-sm" id="btnFormRfa" style="margin-left:auto" type="button"
          onclick="event.stopPropagation();basculerFormRfa()" aria-expanded="false">Ouvrir</button>
      </div>
      <div class="card-b" id="corpsFormRfa" style="display:none">
        <div class="grid">
          <label class="field">
            <span class="fl">Portée</span>
            <div class="seg" id="segPortee">
              <button data-v="reference" class="on" onclick="setPortee('reference')">Par référence</button>
              <button data-v="fournisseur" onclick="setPortee('fournisseur')">Par fournisseur</button>
            </div>
          </label>

          <label class="field" style="grid-column:span 2" id="wrapRef">
            <span class="fl">Référence (matière)</span>
            <select id="inRef" onchange="pickRef(this.value)"></select>
          </label>
          <label class="field" style="grid-column:span 2; display:none" id="wrapFournSel">
            <span class="fl">Fournisseur</span>
            <select id="inFournSel" onchange="setVal('fournisseur', this.value)"></select>
          </label>

          <label class="field">

<script>
/* ═══════════════════════════════════════════════════════════════════════
   BRANCHER (1) — Catalogue des références (extrait réel de l'app).
   Remplacez ce tableau par vos 387 réfs de l'onglet « Par matière »
   (nom, categorie, fournisseur, unite, qteBdc, qteRecue, montantHt).
   ═══════════════════════════════════════════════════════════════════════ */
let REFERENCES = [
  { id:"r1", nom:"BEURRE TOURAGE",             categorie:"BOF",         fournisseur:"ISIGNY SAINTE MERE", unite:"kg", qteBdc:27540,  qteRecue:17390,  montantHt:272646 },
  { id:"r2", nom:"BEURRE CUBE",                categorie:"BOF",         fournisseur:"DELON",              unite:"kg", qteBdc:24400,  qteRecue:52000,  montantHt:112300 },
  { id:"r3", nom:"FILET DE POULET CUIT HALAL", categorie:"CHARCUTERIE", fournisseur:"FUSEAU",             unite:"kg", qteBdc:9818,   qteRecue:13938,  montantHt:106520 },
  { id:"r4", nom:"FARINE TRADITION - T65",     categorie:"FARINE",      fournisseur:"FUSEAU",             unite:"kg", qteBdc:54819,  qteRecue:32159,  montantHt:89834  },
  { id:"r5", nom:"CAPSULE CAFE FORTE X50",     categorie:"CONS/HYGIENE",fournisseur:"NESPRESSO",          unite:"u",  qteBdc:108400, qteRecue:121550, montantHt:87024  },
];
let FOURNISSEURS = [...new Set(REFERENCES.map(r => r.fournisseur))].sort();
let STORE_IDS_RFA = [];
let PRODUITS_RFA = {};

  /* -- Catalogue complet (partage avec la page Fournisseurs) --
     On reutilise le meme cache serveur (/api/cache?key=fournisseurs) : toutes les
        references et tous les fournisseurs y sont deja presents. Les quantites
           commandees/recues et le montant HT ne sont pas fournis par ce cache (ce sont des
              agregats de commandes calcules dans "Achats bruts") : ils restent a 0 et peuvent
                 etre saisis manuellement dans le formulaire. */
  function shortUniteRfa(u){
      u = (u||"").toLowerCase();
      if(/kilogramme|\bkg\b/.test(u)) return "kg";
      if(/litre|\bl\b/.test(u)) return "L";
      if(/pi[eè]ce|unit[ée]/.test(u)) return "u";
      return (u||"u").slice(0,10);
  }
  async function chargerCatalogueComplet(){
      try{
            const r = await fetch(window.location.origin + "/api/cache?key=fournisseurs", { cache:"no-store" });
            if(!r.ok) return;
            const j = await r.json();
            if(!j || !j.dataB64) return;
            const bin = Uint8Array.from(atob(j.dataB64), c => c.charCodeAt(0));
            const snap = JSON.parse(pako.ungzip(bin, { to:"string" }));
            const rows = snap.rows || [];
            if(!rows.length) return;
            REFERENCES = rows.map(r => ({
                    id: r.id,
                    nom: r.ref,
                    categorie: r.cat || "",
                    fournisseur: r.supplier || "Inconnu",
                    unite: r.isKg ? "kg" : shortUniteRfa(r.unit),
supplierId: r.supplierId || null,
                    qteBdc: 0, qteRecue: 0, montantHt: 0,
            }));
            const nomsFournisseurs = (snap.suppliers || []).map(s => s.name).filter(Boolean);
            FOURNISSEURS = [...new Set([...nomsFournisseurs, ...REFERENCES.map(r => r.fournisseur)])].sort((a,b)=>a.localeCompare(b,"fr"));
            STORE_IDS_RFA = [...new Set((snap.suppliers || []).flatMap(s => (s.stores || []).map(st => st.id)))];
PRODUITS_RFA = {};
(snap.products || []).forEach(p => { PRODUITS_RFA[p.id] = p; });
fillSelects();
render();
      }catch(e){ console.warn("Catalogue complet indisponible, utilisation de l'extrait de secours.", e); }
}
let qtyCacheRfa = {}; let lastKeyRfa = null;
async function callProxyRfa(endpoint, body, method){
  const payload = { endpoint, method: method || "POST" };
  if(body) payload.body = body;
  const r = await fetch(window.location.origin + "/api/proxy", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
  if(!r.ok) throw new Error("proxy " + r.status);
  return r.json();
}
/* Calcule les quantites commandee et recue d une reference sur une periode,
   independamment du formulaire. Sert a remplir les colonnes du tableau. */
async function scanQtesRfa(ref, dateDebut, dateFin){
  if(!ref || !ref.supplierId || !STORE_IDS_RFA.length || !dateDebut || !dateFin) return null;
  const key = ref.id + "|" + dateDebut + "|" + dateFin;
  if(qtyCacheRfa[key]) return { bdc:qtyCacheRfa[key].bdc, recue:qtyCacheRfa[key].recue };
  try{
    let orders=[], skip=0; const limit=100; let total=Infinity, garde=0;
    while(skip<total && garde++<250){
      const res = await callProxyRfa("/public/v2/orders?skip="+skip+"&limit="+limit,
        { storeIds: STORE_IDS_RFA, startDate: dateDebut, endDate: dateFin }, "POST");
      total = res.total || 0; const d = res.data || [];
      orders = orders.concat(d); skip += limit; if(!d.length) break;
    }
    const commandes = orders.filter(o => (o.reference||"").match(/^CMD-(LAB|TFB)/) && o.statusName !== "DRAFT" && o.supplier && o.supplier.id === ref.supplierId);
    let bdc=0, recue=0;
    if(commandes.length){
      const ids=[...new Set(commandes.map(o=>o.id))];
      const produit = PRODUITS_RFA[ref.id];
      const pkgMap={}; ((produit && produit.packagings)||[]).forEach(pk=>{ pkgMap[pk.id]={qty:pk.quantity,name:pk.name}; });
      for(let i=0;i<ids.length;i+=15){
        const batch=ids.slice(i,i+15);
        const results = await Promise.all(batch.map(id => callProxyRfa("/public/v2/orders/"+id, null, "GET").catch(()=>null)));
        for(const res of results){
          const lignes=(res && res.data)||[];
          for(const l of lignes){
            if(l.supplierProductId !== ref.id) continue;
            const infoOrd = pkgMap[l.orderedPackagingId];
            const pkgOrdered = infoOrd ? infoOrd.qty : 1;
            const infoInv = pkgMap[l.invoicedPackagingId] || infoOrd;
            const pkgInvoiced = infoInv ? infoInv.qty : 1;
            bdc   += (l.orderedQuantity || 0) * pkgOrdered;
            recue += (l.receivedQuantity || 0) * (l.orderedQuantity ? pkgOrdered : pkgInvoiced);
          }
        }
      }
    }
    return { bdc: Math.round(bdc), recue: Math.round(recue) };
  }catch(e){ console.warn("Quantites RFA indisponibles.", e); return null; }
}
/* Remplit les colonnes Qte commandee / Qte recue de toutes les RFA sur reference. */
let __calculEnCoursRfa = false;
async function calculerQtesTableauRfa(){
  if(__calculEnCoursRfa) return;
  __calculEnCoursRfa = true;
  const btn = document.getElementById("btnQtesRfa");
  const cibles = RFAS.filter(r => r.portee === "reference" && r.refId);
  let fait = 0;
  for(const r of cibles){
    if(btn) btn.textContent = "Calcul… " + (fait+1) + "/" + cibles.length;
    const ref = refById(r.refId);
    const d = await scanQtesRfa(ref, r.dateDebut, r.dateFin);
    if(d){ r.qteBdc = d.bdc; r.qteRecue = d.recue; render(); }
    fait++;
  }
  if(btn) btn.textContent = "Recalculer les quantités";
  try{ persistRFAs(); }catch(e){}
  __calculEnCoursRfa = false;
  render();
}
async function calculerQuantitesRfa(){
  if(form.portee !== "reference" || !form.refId) return;
  const ref = refById(form.refId);
  if(!ref || !ref.supplierId || !STORE_IDS_RFA.length) return;
  const key = ref.id + "|" + form.dateDebut + "|" + form.dateFin; lastKeyRfa = key;
  if(qtyCacheRfa[key]){ appliquerQuantitesRfa(key); return; }
  const inQte = $("inQte");
  const oldPlaceholder = inQte ? inQte.placeholder : "";
  if(inQte) inQte.placeholder = "Calcul en cours...";
const pkgElRfa = $("pkgDetailRfa"); if(pkgElRfa) pkgElRfa.textContent = ""; const progWrapRfa = $("miniProgWrapRfa"); if(progWrapRfa) progWrapRfa.style.display = "inline-flex";
  try{
    let orders = [];
    let skip = 0; const limit = 100; let total = Infinity;
    while(skip < total){
      const res = await callProxyRfa("/public/v2/orders?skip=" + skip + "&limit=" + limit, { storeIds: STORE_IDS_RFA, startDate: form.dateDebut, endDate: form.dateFin }, "POST");
      total = res.total || 0;
      orders = orders.concat(res.data || []);
      skip += limit;
      if(skip > 20000) break;
    }
    const commandes = orders.filter(o => (o.reference||"").match(/^CMD-(LAB|TFB)/) && o.statusName !== "DRAFT" && o.supplier && o.supplier.id === ref.supplierId);
    let bdc = 0, recue = 0;
const bdcDetail = {}, recueDetail = {};
    if(commandes.length){
      const ids = [...new Set(commandes.map(o => o.id))];
      const produit = PRODUITS_RFA[ref.id];
      const pkgMap = {};
      ((produit && produit.packagings) || []).forEach(pk => { pkgMap[pk.id] = { qty: pk.quantity, name: pk.name }; });
      const batchSize = 15;
      for(let i = 0; i < ids.length; i += batchSize){
        const batch = ids.slice(i, i + batchSize);
        const results = await Promise.all(batch.map(id => callProxyRfa("/public/v2/orders/" + id, null, "GET")));
        for(const res of results){
          const lignes = (res && res.data) || [];
          for(const l of lignes){
            if(l.supplierProductId !== ref.id) continue;
            const infoOrd = pkgMap[l.orderedPackagingId];
const pkgOrdered = infoOrd ? infoOrd.qty : 1;
            const infoInv = pkgMap[l.invoicedPackagingId] || infoOrd;
const pkgInvoiced = infoInv ? infoInv.qty : 1;
            bdc += (l.orderedQuantity || 0) * pkgOrdered;
            /* la quantite recue est exprimee dans le conditionnement COMMANDE ;
               on ne retombe sur celui de la facture que s il n y a pas de ligne commandee */
            recue += (l.receivedQuantity || 0) * (l.orderedQuantity ? pkgOrdered : pkgInvoiced);
if(infoOrd && infoOrd.qty !== 1 && l.orderedQuantity){
const d = bdcDetail[l.orderedPackagingId] || (bdcDetail[l.orderedPackagingId] = { name: infoOrd.name, count: 0, kg: 0 });
d.count += l.orderedQuantity; d.kg += l.orderedQuantity * pkgOrdered;
}
if(infoInv && infoInv.qty !== 1 && l.receivedQuantity){
const kInv = l.invoicedPackagingId || l.orderedPackagingId;
const d2 = recueDetail[kInv] || (recueDetail[kInv] = { name: infoInv.name, count: 0, kg: 0 });
d2.count += l.receivedQuantity; d2.kg += l.receivedQuantity * pkgInvoiced;
}
          }
        }
      }
    }
    qtyCacheRfa[key] = { bdc: Math.round(bdc), recue: Math.round(recue), bdcDetail, recueDetail };
  }catch(e){
    console.warn("Calcul automatique des quantites indisponible.", e);
    qtyCacheRfa[key] = null;
  }finally{
    if(inQte) inQte.placeholder = oldPlaceholder; if(progWrapRfa) progWrapRfa.style.display = "none";
  }
  if(qtyCacheRfa[key]) appliquerQuantitesRfa(key);
}
function appliquerQuantitesRfa(key){
  const data = qtyCacheRfa[key]; if(!data) return;
  const ref = refById(form.refId); if(!ref) return;
  ref.qteBdc = data.bdc; ref.qteRecue = data.recue;
  form.quantite = form.remiseConditionnement ? Math.round(Object.values((form.base === "recue" ? data.recueDetail : data.bdcDetail) || {}).reduce((s,d)=>s+(d.count||0),0)) : (form.base === "recue" ? data.recue : data.bdc);
afficherDetailPackagingRfa(key);
  syncForm();
}
function afficherDetailPackagingRfa(key){
const el = $("pkgDetailRfa"); if(!el) return;
const data = qtyCacheRfa[key];
const detail = data && (form.base === "recue" ? data.recueDetail : data.bdcDetail);
const entries = detail ? Object.values(detail) : [];
el.textContent = entries.length ? entries.map(d => num(d.count) + " × " + d.name + " (" + num(d.kg) + " kg)").join(" + ") : "";
}
function setRemiseCond(v){ form.remiseConditionnement = (v === "unite"); document.querySelectorAll('#segRemiseCond button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); if(lastKeyRfa) appliquerQuantitesRfa(lastKeyRfa); else syncForm(); } let dateChangeTimerRfa = null;
function onDateChangeRfa(k, v){
  setVal(k, v);
  clearTimeout(dateChangeTimerRfa);
  dateChangeTimerRfa = setTimeout(calculerQuantitesRfa, 550);
}

/* BRANCHER (2) — RFA déjà enregistrées (remplacer par un fetch / stockage). */
let RFAS = [
  { id:"a1", portee:"reference", refId:"r1", fournisseur:"ISIGNY SAINTE MERE", categorie:"BOF", unite:"kg", base:"bdc", quantite:27540, typeRemise:"unitaire", remiseUnit:0.35, tauxPct:0,   dateDebut:"2026-01-01", dateFin:"2026-12-31", montantManuel:null, notes:"Accord annuel — palier 25 t atteint" },
  { id:"a2", portee:"fournisseur", refId:"", fournisseur:"FUSEAU",             categorie:"—",   unite:"€",  base:"ht",  quantite:0,     typeRemise:"pct",      remiseUnit:0,    tauxPct:2.5, dateDebut:"2026-01-01", dateFin:"2026-12-31", montantManuel:null, notes:"2,5 % du CA achats HT fournisseur" },
];

/* ── Format FR ── */
const euro  = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const eur2  = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const num   = n => new Intl.NumberFormat("fr-FR").format(Math.round(n||0));
const TODAY = new Date("2026-07-07");           // ← new Date() en prod
const dfmt  = iso => iso ? new Date(iso).toLocaleDateString("fr-FR") : "—";
const refById = id => REFERENCES.find(r => r.id === id);

/* ── Logique métier ── */
function montantPrevisionnel(r){
  if (r.montantManuel != null && r.montantManuel !== "") return Number(r.montantManuel);
  /* RFA negociee au forfait avec un fournisseur, sans lien avec une reference */
  if (r.typeRemise === "global") return Number(r.montantGlobal)||0;
  if (r.typeRemise === "unitaire") return (Number(r.quantite)||0) * (Number(r.remiseUnit)||0);
  if (r.portee === "reference"){ const x = refById(r.refId); return ((Number(r.tauxPct)||0)/100) * (x ? x.montantHt : 0); }
  const totalFourn = REFERENCES.filter(x => x.fournisseur === r.fournisseur).reduce((s,x)=>s+x.montantHt,0);
  return ((Number(r.tauxPct)||0)/100) * totalFourn;
}
function progression(r){ const d=new Date(r.dateDebut), f=new Date(r.dateFin); if(!(d<f)) return 0; return Math.min(1,Math.max(0,(TODAY-d)/(f-d))); }
/* La RFA a date se calcule sur les quantites reellement enregistrees sur la periode,
   pas au prorata du temps ecoule : quantite de base x remise unitaire. */
function rfaADate(r){ return montantPrevisionnel(r); }
/* Montant de la RFA pour une quantite donnee. Pour une remise unitaire c est
   quantite x remise ; pour une remise en % du HT le montant ne depend pas des
   quantites, on renvoie donc la meme valeur des deux cotes. */
function rfaSurQte(r, qte){
  if(r.typeRemise !== "unitaire") return montantPrevisionnel(r);
  if(qte == null || qte === "") return null;
  return (Number(qte)||0) * (Number(r.remiseUnit)||0);
}
function acquis(r){ return rfaADate(r); }
function statut(r){
  const d=new Date(r.dateDebut), f=new Date(r.dateFin);
  if (TODAY < d) return { key:"avenir",  label:"À venir",  color:"var(--tx2)",  bg:"var(--sur2)" };
  if (TODAY > f) return { key:"echue",   label:"Échue",    color:"var(--tx3)",  bg:"var(--sur2)" };
  return               { key:"encours", label:"En cours", color:"var(--green)",bg:"#eaf6ee" };
}
function joursRestants(r){ return Math.ceil((new Date(r.dateFin)-TODAY)/86400000); }
const labelRfa = r => r.portee === "reference" ? (refById(r.refId)?.nom || "—") : ("Tous · " + r.fournisseur);

/* ── État du formulaire ── */
const EMPTY = { portee:"reference", refId:"", fournisseur:"", categorie:"", unite:"", base:"bdc", quantite:"", typeRemise:"unitaire", remiseUnit:"", tauxPct:"", montantGlobal:"", dateDebut:"2026-01-01", dateFin:"2026-12-31", montantManuel:"", notes:"", remiseConditionnement:false, pkgNom:"" };
let form = {...EMPTY};
let editId = null;

const $ = id => document.getElementById(id);
function setVal(k,v){ form[k]=v; renderPreview(); }
function setPortee(p){
  form.portee=p;
  document.querySelectorAll('#segPortee button').forEach(b=>b.classList.toggle('on', b.dataset.v===p));
  $("wrapRef").style.display = p==="reference" ? "" : "none";
  $("wrapFournSel").style.display = p==="fournisseur" ? "" : "none";
if(p !== "reference"){ const pkgElP = $("pkgDetailRfa"); if(pkgElP) pkgElP.textContent = ""; form.remiseConditionnement=false; const wrapRCp = $("wrapRemiseCond"); if(wrapRCp) wrapRCp.style.display="none"; }
  renderPreview();
}
function pickRef(id){
  const r = refById(id); form.refId=id;
  if(r){ form.fournisseur=r.fournisseur; form.categorie=r.categorie; form.unite=r.unite; form.quantite = form.base==="recue"?r.qteRecue:r.qteBdc; } form.remiseConditionnement = false;
  syncForm();

}
function setBase(b){
  form.base=b;
  document.querySelectorAll('#segBase button').forEach(x=>x.classList.toggle('on', x.dataset.v===b));
  const r = refById(form.refId); if(r){ form.quantite = b==="recue"?r.qteRecue:r.qteBdc; }
  syncForm();

function setType(t){

  document.querySelectorAll('#segType button').forEach(x=>x.classList.toggle('on', x.dataset.v===t));
  $("wrapUnit").style.display = t==="unitaire" ? "" : "none"; if(t!=="unitaire"){ form.remiseConditionnement=false; const wrapRCt = $("wrapRemiseCond"); if(wrapRCt) wrapRCt.style.display="none"; }
  $("wrapPct").style.display  = t==="pct" ? "" : "none";
  var wg=$("wrapGlobal"); if(wg) wg.style.display = t==="global" ? "" : "none";

  if(t==="global" && form.portee!=="fournisseur") setPortee("fournisseur");
  renderPreview();
}
/* Recopie l'état -> champs (après auto-remplissage) */
function syncForm(){
  $("inFourn").value = form.fournisseur||"";
  $("inFournSel").value = form.fournisseur||"";
  $("inQte").value = form.quantite||"";
  $("inUnit").value = form.remiseUnit||"";
  $("inPct").value = form.tauxPct||"";
  $("inManuel").value = form.montantManuel||"";
  if($("inGlobal")) $("inGlobal").value = form.montantGlobal||"";
  $("inNotes").value = form.notes||"";
  $("inDebut").value = form.dateDebut||"";
  $("inFin").value = form.dateFin||"";
  $("inRef").value = form.refId||""; const produitSync = PRODUITS_RFA[form.refId]; const pkgReelleSync = produitSync && (produitSync.packagings||[]).find(pk=>pk.quantity!==1); const wrapRCs = $("wrapRemiseCond"); if(wrapRCs){ wrapRCs.style.display = (form.portee==="reference" && form.typeRemise==="unitaire" && pkgReelleSync) ? "" : "none"; if(pkgReelleSync){ const btns = document.querySelectorAll('#segRemiseCond button'); if(btns[0]) btns[0].textContent = "€ / " + (form.unite||"kg"); if(btns[1]) btns[1].textContent = "€ / " + pkgReelleSync.name; btns.forEach(b=>b.classList.toggle('on', (b.dataset.v==="unite") === !!form.remiseConditionnement)); if(form.remiseConditionnement) form.pkgNom = pkgReelleSync.name; } }
  $("lblQte").textContent = "Quantités (" + (form.remiseConditionnement ? "conditionnement" : (form.unite||"u")) + ")"; if($("lblUnit")) $("lblUnit").textContent = "Remise unitaire (€ / " + (form.remiseConditionnement ? (form.pkgNom || "condit.") : (form.unite||"unité")) + ")";
  renderPreview();
}
function renderPreview(){
  const prev = montantPrevisionnel(form);
  $("pvPrev").textContent = euro(prev);
  /* la tuile "Acquis" (prorata temporel) a ete supprimee : seule la RFA a date subsiste */
  const s = statut(form);
  const el = $("pvStatut"); el.textContent = s.label; el.style.color=s.color; el.style.background=s.bg;
  $("lblQte").textContent = "Quantités (" + (form.remiseConditionnement ? "conditionnement" : (form.unite||"u")) + ")"; if($("lblUnit")) $("lblUnit").textContent = "Remise unitaire (€ / " + (form.remiseConditionnement ? (form.pkgNom || "condit.") : (form.unite||"unité")) + ")";
  const valid = form.portee==="reference" ? form.refId : form.fournisseur;
  $("saveBtn").disabled = !valid;
}
/* Le formulaire est replie par defaut : on ne l ouvre que sur demande,
   ou automatiquement quand on modifie un accord existant. */
function basculerFormRfa(ouvrir){
  var c=document.getElementById("corpsFormRfa"), b=document.getElementById("btnFormRfa");
  if(!c) return;
  var visible = c.style.display !== "none";
  var cible = (ouvrir===true) ? true : (ouvrir===false ? false : !visible);
  c.style.display = cible ? "" : "none";
  if(b){ b.textContent = cible ? "Replier" : "Ouvrir"; b.setAttribute("aria-expanded", cible?"true":"false"); }
}
function cancel(){ form={...EMPTY}; editId=null; resetFormUI(); basculerFormRfa(false); }
function resetFormUI(){
  setPortee(form.portee); setBase(form.base); setType(form.typeRemise);
  syncForm();
  $("formTitle").textContent = editId ? "Modifier la RFA" : "Nouvelle RFA";
  $("saveLbl").textContent = editId ? "Enregistrer" : "Ajouter la RFA";
  $("cancelBtn").style.display = editId ? "" : "none";
}
function save(){
  /* un forfait n exige qu un fournisseur et un montant */
  const valid = form.typeRemise==="global" ? (form.fournisseur && form.montantGlobal!=="")
              : form.portee==="reference" ? form.refId : form.fournisseur;
  if(!valid) return;
  if(editId){ RFAS = RFAS.map(x => x.id===editId ? {...form, id:editId} : x); }
  else { RFAS.push({...form, id:"a"+Date.now()}); }
  /* BRANCHER (3) : persister ici (API / stockage). */
  cancel(); render();
}
function edit(id){
  basculerFormRfa(true);
  const r = RFAS.find(x=>x.id===id); if(!r) return;
  form = {...r}; editId=id; resetFormUI(); window.scrollTo({top:0,behavior:"smooth"});
}
function del(id){ RFAS = RFAS.filter(x=>x.id!==id); render(); }

/* ── Rendu ── */
function fillSelects(){
  $("inRef").innerHTML = '<option value="">— Choisir une réf —</option>' + REFERENCES.map(r=>`<option value="${r.id}">${r.nom}</option>`).join("");
  $("inFournSel").innerHTML = '<option value="">— Choisir un fournisseur —</option>' + FOURNISSEURS.map(f=>`<option value="${f}">${f}</option>`).join("");
  $("fFourn").innerHTML = '<option value="tous">Tous fournisseurs</option>' + FOURNISSEURS.map(f=>`<option value="${f}">${f}</option>`).join("");
  $("fRef").innerHTML = '<option value="tous">Toutes matieres</option>' + REFERENCES.map(r=>`<option value="${r.id}">${r.nom}</option>`).join("");
}
function render(){
      const fF = $("fFourn").value, fS = $("fStatut").value, fR = $("fRef").value;
        const visibles = RFAS.filter(r => (fS==="tous"||statut(r).key===fS) && (fF==="tous"||r.fournisseur===fF) && (fR==="tous"||r.refId===fR));
  const totalCmd  = RFAS.reduce((s,r)=>s+(rfaSurQte(r, r.qteBdc)||0),0);
  const totalRecu = RFAS.reduce((s,r)=>s+(rfaSurQte(r, r.qteRecue)||0),0);
  const actifs    = RFAS.filter(r=>statut(r).key==="encours").length;
  const echeances = RFAS.filter(r=>{const j=joursRestants(r); return j>=0&&j<=60;}).length;
  const m={}; RFAS.forEach(r=>m[r.fournisseur]=(m[r.fournisseur]||0)+(rfaSurQte(r, r.qteBdc)||0));
  const top = Object.entries(m).sort((a,b)=>b[1]-a[1])[0];

  $("statusLine").textContent = `${RFAS.length} accord${RFAS.length>1?"s":""} RFA · ${actifs} en cours · ${echeances} échéance${echeances>1?"s":""} sous 60 jours`;

  $("kpis").innerHTML = [
    ["RFA / commandé", euro(totalCmd), "quantités commandées × remise", true],
    ["RFA / réceptionné", euro(totalRecu), "quantités reçues × remise", false],
    ["Accords actifs", num(actifs), RFAS.length+" au total", false],
    ["Échéances < 60 j", num(echeances), "à relancer", false],
    ["Top fournisseur", top?top[0]:"—", top?euro(top[1]):"", false],
  ].map(([l,v,s,t])=>`<div class="kpi ${t?'tint':''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");

  $("tblCount").textContent = `${visibles.length} affiché${visibles.length>1?"s":""}`;
  if(!visibles.length){ $("tblHost").innerHTML = '<div class="empty">Aucune RFA pour ces filtres. Ajoutez-en une avec le formulaire ci-dessus.</div>'; return; }

  const rows = visibles.map(r=>{
    const s=statut(r);
    const mCmd = rfaSurQte(r, r.qteBdc), mRecu = rfaSurQte(r, r.qteRecue);
    const cellMt = (v, actif) => v==null ? '<span style="color:var(--tx3)">—</span>'
      : (actif ? `<b style="color:var(--gdark)">${euro(v)}</b>` : `<span style="color:var(--tx2)">${euro(v)}</span>`);
    const uniteAff = r.remiseConditionnement ? (r.pkgNom || "condit.") : r.unite; const remise = r.typeRemise==="unitaire" ? `${eur2(r.remiseUnit)} / ${uniteAff}`
      : r.typeRemise==="global" ? "Forfait négocié" : `${num(r.tauxPct)} % HT`;
    const base = r.typeRemise==="unitaire" ? `${num(r.quantite)} ${uniteAff}` : "—";
    /* Base = quantite sur laquelle la remise est calculee : commandee ou recue. */
    const surRecue = r.base === "recue";
    const baseTagCourt = r.typeRemise==="unitaire"
      ? `<div style="font-size:10px;color:var(--tx3)">base du contrat</div>` : "";
    const tagForfait = r.typeRemise==="global"
      ? `<div style="font-size:10px;color:var(--tx3)">forfait, hors quantités</div>` : "";
    const uQte = r.unite ? " " + r.unite : "";
    const cellQte = (v, actif) => v==null || v==="" ? '<span style="color:var(--tx3)">—</span>'
      : (actif ? `<b>${num(v)}${uQte}</b>` : `<span style="color:var(--tx2)">${num(v)}${uQte}</span>`);
    return `<tr>
      <td style="font-weight:600">${labelRfa(r)}</td>
      <td>${r.fournisseur}</td>
      <td style="color:var(--tx2)">${r.categorie||"—"}</td>
      <td style="color:var(--tx2);white-space:nowrap">${dfmt(r.dateDebut)} → ${dfmt(r.dateFin)}</td>
      <td>${remise}</td>
      <td class="num">${cellQte(r.qteBdc, !surRecue)}</td>
      <td class="num">${cellQte(r.qteRecue, surRecue)}</td>
      <td class="num">${cellMt(mCmd, r.typeRemise==="global" || !surRecue)}${!surRecue?baseTagCourt:""}${tagForfait}</td>
      <td class="num">${cellMt(mRecu, r.typeRemise==="global" || surRecue)}${surRecue?baseTagCourt:""}${tagForfait}</td>
      <td><span class="badge" style="color:${s.color};background:${s.bg}">${s.label}</span></td>
      <td class="num"><button class="ib" onclick="edit('${r.id}')"><i class="ti ti-pencil"></i></button> <button class="ib" onclick="del('${r.id}')"><i class="ti ti-trash"></i></button></td>
    </tr>`;
  }).join("");

  $("tblHost").innerHTML = `<table class="tbl"><thead><tr>
      <th>Référence / portée</th><th>Fournisseur</th><th>Catégorie</th><th>Période</th>
      <th>Remise</th><th class="num">Qté commandée</th><th class="num">Qté reçue</th><th class="num">RFA / commandé</th><th class="num">RFA / réceptionné</th><th>Statut</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

/* ── Export CSV ── */
function exportCSV(){
  const head = ["Référence/portée","Fournisseur","Catégorie","Début","Fin","Type","Remise","Qté commandée","Qté reçue","Base retenue","Base qté","RFA / commandé","RFA / réceptionné","Statut","Notes"];
  const lines = RFAS.map(r=>[
    labelRfa(r), r.fournisseur, r.categorie, r.dateDebut, r.dateFin,
    r.typeRemise==="unitaire"?"unitaire":"%HT",
    r.typeRemise==="unitaire"?r.remiseUnit:r.tauxPct,
    r.qteBdc==null?"":r.qteBdc, r.qteRecue==null?"":r.qteRecue,
    r.base==="recue"?"reçue":"commandée",
    r.typeRemise==="unitaire"?r.quantite:"",
    Math.round(rfaSurQte(r, r.qteBdc)||0), Math.round(rfaSurQte(r, r.qteRecue)||0), statut(r).label, (r.notes||"").replace(/"/g,'""')
  ].map(v=>`"${v}"`).join(";"));
  const csv = "\uFEFF" + [head.join(";"), ...lines].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "rfa.csv"; a.click(); URL.revokeObjectURL(a.href);
}

/* ── Init ── */
fillSelects();
resetFormUI();
render();
/* Au premier affichage, on complete les quantites manquantes sans rien demander. */
setTimeout(function(){
  try{
    var manque = RFAS.some(function(r){ return r.portee==="reference" && r.refId && (r.qteBdc==null || r.qteRecue==null); });
    if(manque && STORE_IDS_RFA && STORE_IDS_RFA.length) calculerQtesTableauRfa();
  }catch(e){}
}, 2500);

  chargerCatalogueComplet();
  async function persistRFAs(){try{const gz=pako.gzip(JSON.stringify(RFAS));let bin="";const CH=32768;for(let i=0;i<gz.length;i+=CH){bin+=String.fromCharCode.apply(null,gz.subarray(i,i+CH));}await fetch(window.location.origin+"/api/cache?key=rfa",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dataB64:btoa(bin)})});}catch(e){console.warn("Persistance RFA impossible.",e);}}async function chargerRFAs(){try{const r=await fetch(window.location.origin+"/api/cache?key=rfa",{cache:"no-store"});if(!r.ok)return;const j=await r.json();if(!j||!j.dataB64)return;const bin2=Uint8Array.from(atob(j.dataB64),c=>c.charCodeAt(0));const arr=JSON.parse(pako.ungzip(bin2,{to:"string"}));if(Array.isArray(arr)){RFAS=arr;render();}}catch(e){console.warn("Chargement RFA indisponible, utilisation des donnees par defaut.",e);}}function save(){const valid=form.portee==="reference"?form.refId:form.fournisseur;if(!valid)return;if(editId){RFAS=RFAS.map(x=>x.id===editId?{...form,id:editId}:x);}else{RFAS.push({...form,id:"a"+Date.now()});}persistRFAs();cancel();render();}function del(id){RFAS=RFAS.filter(x=>x.id!==id);persistRFAs();render();}chargerRFAs();
</script>
